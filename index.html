<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preload" href="/fonts/Phosphate.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/Rockwell-Bold.woff2" as="font" type="font/woff2" crossorigin>
<title>Pedro Rodrigues — Retouch &amp; Compositing</title>
<style>
@font-face{
  font-family:Phosphate;
  src:url("/fonts/Phosphate.woff2") format("woff2"),
      url("/fonts/Phosphate.woff") format("woff"),
      url("/fonts/Phosphate.otf") format("opentype");
  font-weight:400;
  font-style:normal;
  font-display:swap;
}
@font-face{
  font-family:RockwellBold;
  src:url("/fonts/Rockwell-Bold.woff2") format("woff2"),
      url("/fonts/Rockwell-Bold.woff") format("woff"),
      url("/fonts/Rockwell-Bold.otf") format("opentype"),
      url("/fonts/Rockwell-Bold.ttf") format("truetype"),
      url("/fonts/Rockwell.ttc") format("collection");
  font-weight:700;
  font-display:swap;
}
:root{
  --black:#0a0a0b;--white:#f4f4ef;
  --yellow:#ffd800;--cyan:#00c8f2;--pink:#ff4db8;--acid:#d8ff17;--orange:#ff6a31;
  --blue:#3157ff;--purple:#9969ff;--mint:#67f0bd;--cream:#efe8db;--red:#ff413d;
  --display:"Phosphate","RockwellBold","Arial Black",sans-serif;
  --rock:"RockwellBold",ui-monospace,"SF Mono",Menlo,Monaco,Consolas,"Courier New",monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;background:var(--black);color:var(--white);font-family:var(--rock);overflow-x:hidden}
button{font-family:var(--rock)}
#stage{min-height:760px}
.identity{
  font-family:var(--display);
  font-weight:400;
  font-synthesis:none;
  font-size:clamp(42px,5.8vw,86px);
  line-height:.83;
  letter-spacing:.005em;
  text-transform:uppercase
}
.subline,.meta,.project-title,.label,.tag,.bigword{font-family:var(--rock)}
.subline{font-size:11px;line-height:1.2;letter-spacing:.05em;text-transform:uppercase}
.meta{font-size:9px;line-height:1.25;letter-spacing:.06em;text-transform:uppercase}
.media{position:relative;background:#141416 center/cover no-repeat;overflow:hidden}
.media:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.38),transparent 62%);pointer-events:none}
.card{cursor:pointer}

/* 01 CLASSIC CHROMA / cleaned */
.v1{background:var(--yellow);color:#111;padding:10px}
.v1 .hero{background:#111;color:#fff;padding:26px;min-height:300px;display:flex;flex-direction:column;justify-content:space-between}
.v1 .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:10px;margin-top:10px}
.v1 .tile{grid-column:span 4;border:4px solid #111;background:#fff;overflow:hidden}
.v1 .tile:nth-child(6n+1){grid-column:span 8;background:var(--pink)}
.v1 .tile:nth-child(6n+2){background:var(--acid)}
.v1 .tile:nth-child(6n+3){background:var(--orange)}
.v1 .tile:nth-child(6n+4){background:var(--cyan)}
.v1 .tile .media{aspect-ratio:4/3;border-bottom:4px solid #111}
.v1 .tx{padding:13px}.v1 .tx b{font-size:20px}.v1 .tx span{display:block;margin-top:5px}

/* 02 OFFSET GRID */
.v2{background:#f4f0e7;color:#111;padding:12px}
.v2 .hero{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.v2 .left{background:var(--pink);padding:28px;min-height:240px}
.v2 .right{background:#111;color:white;padding:24px;display:flex;align-items:end}
.v2 .grid{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:210px;gap:10px;margin-top:10px}
.v2 .cell{border:4px solid #111;position:relative;overflow:hidden}
.v2 .cell:nth-child(7n+1){grid-column:span 3;grid-row:span 2}
.v2 .cell:nth-child(7n+2){grid-column:span 2}
.v2 .cell:nth-child(7n+3){grid-column:span 1}
.v2 .cell:nth-child(7n+4){grid-column:span 2}
.v2 .cell:nth-child(7n+5){grid-column:span 2}
.v2 .cell:nth-child(7n+6){grid-column:span 1}
.v2 .cell:nth-child(7n){grid-column:span 3}
.v2 .cell .media{position:absolute;inset:0}
.v2 .cap{position:absolute;z-index:3;left:8px;right:8px;bottom:8px;background:#fff;color:#111;padding:8px;border:2px solid #111}

/* 03 COLOR BANDS */
.v3{background:#0c0c0d}
.v3 .hero{padding:26px}
.v3 .band{display:grid;grid-template-columns:260px 1fr;min-height:250px;border-top:3px solid #111}
.v3 .band:nth-child(5n+1){background:var(--acid);color:#111}
.v3 .band:nth-child(5n+2){background:var(--pink);color:#111}
.v3 .band:nth-child(5n+3){background:var(--cyan);color:#111}
.v3 .band:nth-child(5n+4){background:var(--orange);color:#111}
.v3 .band:nth-child(5n){background:var(--purple);color:#111}
.v3 .bandtext{padding:20px;display:flex;flex-direction:column;justify-content:space-between}
.v3 .bandtext b{font-size:23px}
.v3 .band .media{min-height:250px}

/* 04 HUGE IMAGE / TINY BLOCKS */
.v4{background:var(--blue);padding:10px}
.v4 .hero{background:#111;padding:24px;margin-bottom:10px;min-height:280px}
.v4 .feature{display:grid;grid-template-columns:2.2fr .8fr;gap:10px}
.v4 .feature .bigimg{min-height:650px;border:4px solid #111}
.v4 .rail{display:grid;grid-template-columns:1fr;gap:10px}
.v4 .small{border:4px solid #111;background:#fff;color:#111;display:grid;grid-template-columns:110px 1fr;min-height:120px}
.v4 .small .media{height:100%}
.v4 .smalltxt{padding:10px}.v4 .smalltxt b{font-size:16px}

/* 05 POSTER GRID */
.v5{background:var(--cream);color:#111;padding:12px}
.v5 .hero{display:flex;justify-content:space-between;gap:20px;align-items:end;padding:18px 8px 26px}
.v5 .posters{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.v5 .poster{border:4px solid #111;padding:8px;background:#fff;min-height:520px;display:flex;flex-direction:column}
.v5 .poster:nth-child(4n+1){background:var(--pink)}
.v5 .poster:nth-child(4n+2){background:var(--acid)}
.v5 .poster:nth-child(4n+3){background:var(--cyan)}
.v5 .poster:nth-child(4n){background:var(--orange)}
.v5 .poster .media{aspect-ratio:4/3;border:3px solid #111}
.v5 .poster h3{font-size:34px;line-height:.9;margin:18px 6px 10px}
.v5 .poster .meta{margin:0 6px 8px}

/* 06 SIDE INDEX */
.v6{background:#0a0a0b;display:grid;grid-template-columns:360px 1fr;min-height:900px}
.v6 .index{background:var(--acid);color:#111;padding:20px;position:sticky;top:48px;height:calc(100vh - 48px);overflow:auto}
.v6 .index .identity{font-size:52px}
.v6 .ix{padding:11px 0;border-top:1px solid #111;font-size:14px;cursor:pointer}
.v6 .display{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:8px}
.v6 .display .card{border:1px solid #28282e}
.v6 .display .media{aspect-ratio:16/10}
.v6 .display .label{padding:12px;background:#121216}

/* 07 COLOR WINDOWS */
.v7{background:#1a1a1c;padding:16px}
.v7 .hero{padding:8px 8px 24px}
.v7 .windows{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}
.v7 .win{grid-column:span 4;border:3px solid #111;background:#fff;color:#111;box-shadow:10px 10px 0 #000}
.v7 .win:nth-child(6n+1){grid-column:span 7;background:var(--pink)}
.v7 .win:nth-child(6n+2){grid-column:span 5;background:var(--cyan)}
.v7 .win:nth-child(6n+3){grid-column:span 4;background:var(--acid)}
.v7 .win:nth-child(6n+4){grid-column:span 8;background:var(--orange)}
.v7 .bar{height:24px;border-bottom:3px solid #111;display:flex;gap:5px;align-items:center;padding:0 7px}
.v7 .dot{width:8px;height:8px;border-radius:50%;background:#111}
.v7 .win .media{aspect-ratio:16/10}
.v7 .wcap{padding:10px}.v7 .wcap b{font-size:18px}

/* 08 EDITORIAL BLOCKS */
.v8{background:#fff;color:#111;padding:16px}
.v8 .hero{display:grid;grid-template-columns:1.4fr .6fr;border-bottom:3px solid #111;padding-bottom:18px}
.v8 .heroaside{display:flex;align-items:end;font-size:18px}
.v8 .editorial{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;margin-top:14px}
.v8 article:nth-child(5n+1){grid-column:1/9}
.v8 article:nth-child(5n+2){grid-column:9/13;margin-top:100px}
.v8 article:nth-child(5n+3){grid-column:2/6;margin-top:30px}
.v8 article:nth-child(5n+4){grid-column:6/13}
.v8 article:nth-child(5n){grid-column:1/7;margin-top:70px}
.v8 article .media{aspect-ratio:4/3}
.v8 article:nth-child(5n+2) .media,.v8 article:nth-child(5n+3) .media{aspect-ratio:4/5}
.v8 .ecap{border-top:2px solid #111;padding-top:7px;margin-top:7px}

/* 09 MICRO TO MACRO */
.v9{background:var(--yellow);color:#111;padding:10px}
.v9 .hero{background:#111;color:#fff;padding:24px;min-height:280px}
.v9 .micro{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin-top:10px}
.v9 .thumb{border:3px solid #111;background:#fff}
.v9 .thumb .media{aspect-ratio:1}
.v9 .thumb .meta{padding:7px}
.v9 .macro{margin-top:10px;border:4px solid #111;display:grid;grid-template-columns:1.5fr .5fr;background:var(--cyan)}
.v9 .macro .media{min-height:620px}
.v9 .macrotext{padding:22px;display:flex;flex-direction:column;justify-content:end}
.v9 .macrotext b{font-size:46px;line-height:.9}

/* 10 HARD CUT */
.v10{background:#000;padding:10px}
.v10 .hero{background:var(--red);color:#111;padding:24px;min-height:300px}
.v10 .hard{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;margin-top:10px}
.v10 .hard .card{grid-column:span 3;min-height:260px;position:relative}
.v10 .hard .card:nth-child(7n+1){grid-column:span 6;min-height:520px}
.v10 .hard .card:nth-child(7n+2){grid-column:span 3}
.v10 .hard .card:nth-child(7n+3){grid-column:span 3}
.v10 .hard .card:nth-child(7n+4){grid-column:span 4}
.v10 .hard .card:nth-child(7n+5){grid-column:span 8}
.v10 .hard .media{position:absolute;inset:0}
.v10 .hardcap{position:absolute;z-index:3;left:10px;bottom:10px;right:10px;color:#fff;text-shadow:0 2px 8px #000}
.v10 .hardcap b{font-size:18px}

/* overlay */
.overlay{position:fixed;inset:0;z-index:1000;background:rgba(4,4,5,.985);display:none;overflow:auto}
.overlay.open{display:block}
.ovtop{position:sticky;top:0;z-index:3;background:rgba(4,4,5,.95);padding:14px 18px;border-bottom:1px solid #29292e;display:flex;justify-content:space-between;gap:20px}
.ovtitle b{font-size:22px}.ovtitle span{display:block;color:#96969c;margin-top:4px}
.close{border:1px solid #444;background:#17171b;color:white;border-radius:999px;padding:9px 12px}
.ovgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:3px;padding:3px}.ovgrid .media{aspect-ratio:4/3}

@media(max-width:950px){
 .v2 .hero,.v4 .feature,.v8 .hero,.v9 .macro{grid-template-columns:1fr}
 .v5 .posters{grid-template-columns:repeat(2,1fr)}
 .v6{grid-template-columns:1fr}.v6 .index{position:relative;top:0;height:auto}.v6 .display{grid-template-columns:1fr}
 .v7 .win,.v7 .win:nth-child(6n+1),.v7 .win:nth-child(6n+2),.v7 .win:nth-child(6n+3),.v7 .win:nth-child(6n+4){grid-column:span 6}
 .v9 .micro{grid-template-columns:repeat(4,1fr)}
}
@media(max-width:650px){
 .identity{font-size:46px}
 .v1 .tile,.v1 .tile:nth-child(6n+1){grid-column:span 12}
 .v2 .grid{grid-template-columns:1fr}.v2 .cell,.v2 .cell:nth-child(n){grid-column:span 1;grid-row:span 1}
 .v3 .band{grid-template-columns:1fr}.v3 .band .media{min-height:360px}
 .v5 .posters{grid-template-columns:1fr}
 .v7 .win,.v7 .win:nth-child(n){grid-column:span 12}
 .v8 .editorial{display:block}.v8 article{margin:0 0 30px!important}
 .v9 .micro{grid-template-columns:repeat(2,1fr)}
 .v10 .hard .card,.v10 .hard .card:nth-child(n){grid-column:span 12;min-height:360px}
 .ovgrid{grid-template-columns:1fr}
}

/* DESIGN-SPECIFIC PROJECT VIEWERS */
.overlay.view1{background:#ffd800;color:#111;padding:10px}
.overlay.view1 .ovtop{background:#111;color:#fff;border:4px solid #111}
.overlay.view1 .ovgrid{grid-template-columns:repeat(12,1fr);gap:10px;padding:10px 0}
.overlay.view1 .ovgrid .media{grid-column:span 6;aspect-ratio:4/3;border:4px solid #111}
.overlay.view1 .ovgrid .media:nth-child(3n+1){grid-column:span 8}
.overlay.view1 .ovgrid .media:nth-child(3n+2){grid-column:span 4}
.overlay.view1 .close{background:var(--cyan);color:#111;border:3px solid #111;border-radius:0;font-weight:700}

.overlay.view2{background:#f4f0e7;color:#111}
.overlay.view2 .ovtop{background:var(--pink);color:#111;border-bottom:4px solid #111}
.overlay.view2 .ovgrid{display:block;padding:18px}
.overlay.view2 .ovgrid .media{width:min(1100px,88vw);aspect-ratio:16/10;margin:0 0 18px auto;border:4px solid #111}
.overlay.view2 .ovgrid .media:nth-child(even){margin-left:0;margin-right:auto;width:min(760px,72vw)}
.overlay.view2 .close{background:#111;color:#fff;border:0;border-radius:0}

.overlay.view3{background:#0c0c0d}
.overlay.view3 .ovtop{background:var(--acid);color:#111;border-bottom:3px solid #111}
.overlay.view3 .ovgrid{display:flex;flex-direction:column;gap:0;padding:0}
.overlay.view3 .ovgrid .media{width:100%;aspect-ratio:21/9;border-bottom:3px solid #111}
.overlay.view3 .ovgrid .media:nth-child(5n+2){background-color:var(--pink)}
.overlay.view3 .close{background:#111;color:#fff;border:0;border-radius:0}

.overlay.view5{background:var(--cream);color:#111;padding:12px}
.overlay.view5 .ovtop{position:sticky;background:var(--orange);color:#111;border:4px solid #111}
.overlay.view5 .ovgrid{grid-template-columns:repeat(2,1fr);gap:12px;padding:12px 0}
.overlay.view5 .ovgrid .media{border:4px solid #111;box-shadow:10px 10px 0 #111}
.overlay.view5 .ovgrid .media:nth-child(3n+1){grid-column:span 2;aspect-ratio:16/9}
.overlay.view5 .close{background:#fff;color:#111;border:3px solid #111;border-radius:0}

.overlay.view7{background:#1a1a1c;padding:18px}
.overlay.view7 .ovtop{background:var(--cyan);color:#111;border:3px solid #111;box-shadow:9px 9px 0 #000}
.overlay.view7 .ovgrid{grid-template-columns:repeat(2,1fr);gap:14px;padding:24px 0}
.overlay.view7 .ovgrid .media{border:3px solid #111;box-shadow:9px 9px 0 #000}
.overlay.view7 .close{background:#111;color:#fff;border:3px solid #111;border-radius:0}

.overlay.view8{background:#fff;color:#111}
.overlay.view8 .ovtop{background:#fff;color:#111;border-bottom:3px solid #111}
.overlay.view8 .ovgrid{display:block;padding:22px}
.overlay.view8 .ovgrid .media{width:min(1180px,94vw);aspect-ratio:auto;min-height:68vh;margin:0 auto 48px;background-size:contain;background-repeat:no-repeat}
.overlay.view8 .ovgrid .media:nth-child(even){width:min(760px,80vw)}
.overlay.view8 .close{background:#111;color:#fff;border:0;border-radius:0}

.overlay.view10{background:#000}
.overlay.view10 .ovtop{background:var(--red);color:#111;border-bottom:2px solid #000}
.overlay.view10 .ovgrid{grid-template-columns:repeat(12,1fr);gap:2px;padding:2px}
.overlay.view10 .ovgrid .media{grid-column:span 4;aspect-ratio:4/3}
.overlay.view10 .ovgrid .media:nth-child(5n+1){grid-column:span 8;aspect-ratio:16/9}
.overlay.view10 .close{background:#000;color:#fff;border:0;border-radius:0;font-size:18px}

/* 06 SIDE INDEX — persistent navigation + inline project series */
.v6{grid-template-columns:360px minmax(0,1fr);min-height:calc(100vh - 48px)}
.v6 .index{top:48px;height:calc(100vh - 48px);z-index:5}
.v6 .ix{transition:none}
.v6 .ix.active{background:#111;color:var(--acid);margin:0 -20px;padding:11px 20px}
.v6 .display{display:block;padding:12px;min-height:calc(100vh - 48px);background:#0a0a0b}
.v6viewer{min-height:calc(100vh - 72px)}
.v6viewer-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-end;padding:4px 2px 14px;border-bottom:1px solid #34343a;margin-bottom:12px}
.v6viewer-title{font-size:clamp(28px,4vw,58px);line-height:.9}
.v6viewer-meta{max-width:360px;text-align:right;color:#999}
.v6series{display:grid;grid-template-columns:repeat(12,1fr);gap:8px}
.v6series .media{grid-column:span 6;aspect-ratio:4/3}
.v6series .media:first-child{grid-column:span 12;aspect-ratio:16/9}
.v6series .media:nth-child(4n+2){grid-column:span 5}
.v6series .media:nth-child(4n+3){grid-column:span 7}

/* 04 Feature viewer stays in the same page */
.v4series{grid-column:1/-1;background:#111;border:4px solid #111;padding:10px;color:#fff}
.v4series-head{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:10px}
.v4series-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:8px}
.v4series-grid .media{grid-column:span 6;aspect-ratio:4/3}
.v4series-grid .media:first-child{grid-column:span 12;aspect-ratio:16/9}
.v4back{background:var(--cyan);color:#111;border:0;padding:9px 12px}

/* 09 Micro -> Macro inline series */
.v9series{margin-top:10px;border:4px solid #111;background:#111;padding:8px}
.v9series-head{background:var(--cyan);color:#111;padding:12px;display:flex;justify-content:space-between;gap:18px}
.v9series-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:8px;margin-top:8px}
.v9series-grid .media{grid-column:span 6;aspect-ratio:4/3}
.v9series-grid .media:first-child{grid-column:span 12;aspect-ratio:16/9}
.v9back{background:#111;color:#fff;border:0;padding:8px 11px}

@media(max-width:800px){
  .v6{grid-template-columns:1fr}
  .v6 .index{position:relative;top:0;height:auto}
  .v6viewer-meta{text-align:left}
  .v6series .media,.v6series .media:first-child,.v6series .media:nth-child(n){grid-column:span 12}
  .overlay.view1 .ovgrid .media,.overlay.view1 .ovgrid .media:nth-child(n),
  .overlay.view10 .ovgrid .media,.overlay.view10 .ovgrid .media:nth-child(n){grid-column:span 12}
}


.copyblock{
  margin-top:16px;
  max-width:520px;
  font-family:var(--rock);
  font-size:clamp(11px,1.1vw,14px);
  line-height:1.45;
  letter-spacing:.02em;
}
.copyblock .roleline{
  font-size:clamp(11px,1.05vw,13px);
  font-weight:700;
}
.copyblock .serviceline{
  margin-top:8px;
  font-size:10px;
  line-height:1.35;
  letter-spacing:.06em;
  text-transform:uppercase;
  opacity:.78;
}
.copyblock .fragments{
  margin-top:12px;
  font-size:clamp(12px,1.15vw,15px);
  line-height:1.4;
}
.copyblock .fragments span{display:block}
.v2 .copyblock,.v5 .copyblock,.v8 .copyblock{max-width:460px}
.v6 .copyblock{max-width:285px;margin-top:14px}


.copyflow{
  margin-top:18px;
  display:grid;
  grid-template-columns:minmax(180px,.9fr) 1px minmax(180px,1.1fr);
  gap:18px;
  align-items:end;
  max-width:620px;
}
.sourceblock,.finishblock{
  padding:0;
  border:0;
}
.sourceblock{
  display:grid;
  gap:2px;
  font-size:clamp(12px,1.15vw,15px);
  line-height:1.24;
}
.sourceblock span{display:block}
.flowmark{
  width:1px;
  min-height:72px;
  background:currentColor;
  opacity:.35;
  font-size:0;
}
.finishblock{
  display:flex;
  flex-direction:column;
  justify-content:end;
  gap:2px;
  font-size:clamp(12px,1.15vw,15px);
  line-height:1.24;
}
.finishblock strong{font-weight:700}
.v1 .hero{
  display:grid!important;
  grid-template-columns:minmax(0,1.15fr) minmax(320px,.85fr);
  gap:34px;
  align-items:end;
  min-height:250px!important;
}
.v1 .hero .copyblock{margin-top:0;align-self:end}
.v4 .hero,.v9 .hero,.v10 .hero{min-height:235px!important}
.v6 .copyflow{
  grid-template-columns:1fr;
  gap:9px;
  max-width:285px;
}
.v6 .flowmark{
  width:52px;
  height:1px;
  min-height:1px;
}
@media(max-width:850px){
  .v1 .hero{grid-template-columns:1fr}
  .v1 .hero .copyblock{margin-top:16px}
}
@media(max-width:760px){

  let x=a.findIndex(p=>p.project.toLowerCase().includes("opel grandland"));

function bg(el,img,portrait=false){
  el.style.backgroundImage="none";
  if(portrait) el.classList.add("portrait-media");

  let node=el.querySelector(":scope > img.media-img");
  if(!node){
    node=document.createElement("img");
    node.className="media-img";
    node.alt="";
    node.decoding="async";
    node.loading="lazy";
    node.draggable=false;
    el.prepend(node);
  }
  const next=`images/${img}`;
  if(node.getAttribute("src")!==next) node.src=next;

function openFeatureSeries(p){

  box.querySelector(".v4back").onclick=()=>box.remove();
  feature.append(box);
  box.scrollIntoView({behavior:"smooth",block:"start"});
}

function openIndexSeries(p){

  box.scrollIntoView({behavior:"smooth",block:"start"});
}

function openP(p){
  if(ACTIVE===3){openFeatureSeries(p);return}
  if(ACTIVE===5){openIndexSeries(p);return}
  if(ACTIVE===8){openMacroSeries(p);return}

  const viewMap={0:"view1",1:"view2",2:"view3",4:"view5",6:"view7",7:"view8",9:"view10"};
  const closeMap={0:"BACK",1:"← INDEX",2:"← WORK",4:"CLOSE POSTER",6:"[ X ]",7:"← SELECTED WORK",9:"×"};
  ov.className="overlay open "+(viewMap[ACTIVE]||"");

  document.getElementById("opm").textContent=meta(p);

}
