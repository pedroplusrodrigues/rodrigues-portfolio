<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Pedro Rodrigues — Retouch Artist</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
  /* ---- eigene Schriften aus fonts/ (Fallback: Google-Fonts) ---- */
  @font-face {
    font-family: "Phosphate";
    src: url("fonts/Phosphate.woff2") format("woff2"),
         url("fonts/Phosphate.woff") format("woff"),
         url("fonts/Phosphate.otf") format("opentype"),
         url("fonts/Phosphate.ttc") format("collection");
    font-weight: 400 800; font-display: swap;
  }
  @font-face {
    font-family: "RockwellBold";
    src: url("fonts/Rockwell-Bold.woff2") format("woff2"),
         url("fonts/Rockwell-Bold.woff") format("woff"),
         url("fonts/Rockwell-Bold.otf") format("opentype"),
         url("fonts/Rockwell-Bold.ttf") format("truetype"),
         url("fonts/Rockwell.ttc") format("collection");
    font-weight: 700; font-display: swap;
  }

  :root {
    --bg: #08080a;
    --fg: #f4f4f2;
    --dim: #b6b6b3;
    --faint: #34343a;
    --line: #1c1c20;
    --display: "Phosphate", "Syne", -apple-system, BlinkMacSystemFont, sans-serif;
    --mono: "RockwellBold", "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --pad: clamp(18px, 3.4vw, 46px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: var(--mono);
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    overflow: hidden;
  }

  #stage {
    height: 100dvh; overflow-y: scroll;
    scroll-snap-type: y mandatory; scroll-behavior: smooth;
    scrollbar-width: none;
  }
  #stage::-webkit-scrollbar { display: none; }

  section {
    height: 100dvh; scroll-snap-align: start;
    position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }

  /* ---------- hero ---------- */
  #hero .bg {
    position: absolute; inset: 0;
    background-size: cover; background-position: center;
    transform: scale(1.06); animation: heroZoom 14s ease-out forwards;
  }
  @keyframes heroZoom { to { transform: scale(1); } }
  #hero .scrim {
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(8,8,10,.92) 0%, rgba(8,8,10,.12) 44%, rgba(8,8,10,.34) 100%);
  }
  #hero .intro {
    position: relative; width: 100%; padding: var(--pad); align-self: flex-end;
    opacity: 0; transform: translateY(14px);
    animation: rise 1.2s .25s cubic-bezier(.2,.7,.2,1) forwards;
  }
  #hero h1 {
    font-family: var(--display); font-weight: 800;
    letter-spacing: -.01em; line-height: .92;
    font-size: clamp(38px, 8.5vw, 132px); text-transform: uppercase;
    text-shadow: 0 2px 40px rgba(0,0,0,.45);
  }
  #hero .sub {
    margin-top: 15px;
    font-weight: 700;
    font-size: clamp(12px, 1.7vw, 17px);
    letter-spacing: .26em; text-transform: uppercase; color: var(--fg);
    text-shadow: 0 1px 16px rgba(0,0,0,.5);
  }
  #scrollcue {
    position: absolute; left: 50%; bottom: calc(var(--pad) - 4px); transform: translateX(-50%);
    font-size: 10.5px; letter-spacing: .3em; text-transform: uppercase; color: var(--dim);
    animation: bob 2.6s ease-in-out infinite;
  }
  @keyframes bob { 0%,100%{ transform: translate(-50%,0);} 50%{ transform: translate(-50%,6px);} }
  @keyframes rise { to { opacity: 1; transform: none; } }

  /* ---------- gallery frames: vollformatig ---------- */
  .frame { padding: 0; cursor: pointer; }
  .frame img, .frame .placeholder {
    width: 100%; height: 100%;
    object-fit: cover; object-position: center;
    display: block;
    opacity: 0; transform: scale(1.03);
    transition: opacity 1.1s ease, transform 1.7s cubic-bezier(.2,.7,.2,1);
  }
  .frame.seen img, .frame.seen .placeholder { opacity: 1; transform: none; }
  .placeholder {
    background: #101014;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; color: var(--faint);
    font-size: 12px; letter-spacing: .04em; text-align: center; padding: 24px;
  }
  .placeholder .ph-file { color: var(--dim); word-break: break-all; }

  /* ---------- fixed chrome ---------- */
  .chrome { position: fixed; z-index: 20; pointer-events: none; user-select: none; }

  #botscrim {
    left: 0; right: 0; bottom: 0; height: 40vh; z-index: 6;
    background: linear-gradient(to top, rgba(4,4,6,.78) 0%, rgba(4,4,6,.28) 45%, transparent 100%);
    opacity: 0; transition: opacity .45s ease;
  }
  #botscrim.show { opacity: 1; }

  #wordmark {
    top: var(--pad); left: var(--pad);
    font-family: var(--display); font-weight: 700;
    font-size: 15px; letter-spacing: .02em; text-transform: uppercase;
    text-shadow: 0 1px 14px rgba(0,0,0,.6);
    opacity: 0; transform: translateY(-6px);
    transition: opacity .5s ease, transform .5s ease;
  }
  #wordmark.show { opacity: 1; transform: none; }

  #slate {
    left: var(--pad); bottom: var(--pad); max-width: min(74vw, 560px);
    opacity: 0; transition: opacity .45s ease;
    text-shadow: 0 1px 14px rgba(0,0,0,.7);
  }
  #slate.show { opacity: 1; }
  #slate .ph {
    font-family: var(--display); font-weight: 700;
    font-size: clamp(15px, 2vw, 20px); letter-spacing: .01em; color: var(--fg);
  }
  #slate .cr {
    margin-top: 6px; font-size: 12px; letter-spacing: .06em; line-height: 1.5; color: var(--dim);
  }
  #slate .cr .last { color: var(--fg); }

  #counter {
    right: var(--pad); bottom: var(--pad);
    font-size: 12px; letter-spacing: .08em; color: var(--dim);
    font-variant-numeric: tabular-nums; text-align: right;
    text-shadow: 0 1px 14px rgba(0,0,0,.7);
    opacity: 0; transition: opacity .45s ease;
  }
  #counter.show { opacity: 1; }
  #counter .cur { color: var(--fg); }

  #next {
    left: 50%; bottom: calc(var(--pad) - 8px); transform: translateX(-50%);
    width: 44px; height: 44px; border: 0; background: none; cursor: pointer;
    color: var(--fg); font-size: 26px; line-height: 44px; text-align: center;
    text-shadow: 0 1px 14px rgba(0,0,0,.7);
    pointer-events: auto; opacity: 0; transition: opacity .4s ease;
    animation: bob2 2.6s ease-in-out infinite;
  }
  #next.show { opacity: .78; }
  #next:hover { opacity: 1; }
  @keyframes bob2 { 0%,100%{ transform: translate(-50%,0);} 50%{ transform: translate(-50%,5px);} }

  @media (max-width: 640px) {
    #slate { max-width: calc(100vw - 2*var(--pad)); bottom: calc(var(--pad) + 30px); }
    #counter { bottom: calc(var(--pad) + 30px); }
  }
  @media (prefers-reduced-motion: reduce) {
    #stage { scroll-behavior: auto; }
    #hero .bg { animation: none; transform: none; }
    #hero .intro { animation: none; opacity: 1; transform: none; }
    .frame img, .frame .placeholder { transition: none; opacity: 1; transform: none; }
    #scrollcue, #next { animation: none; }
  }
</style>
</head>
<body>
  <header id="wordmark" class="chrome">Pedro Rodrigues</header>
  <div id="botscrim" class="chrome"></div>
  <main id="stage" aria-label="Portfolio"></main>
  <aside id="slate" class="chrome" aria-live="polite">
    <div class="ph" id="slate-ph"></div>
    <div class="cr" id="slate-cr"></div>
  </aside>
  <div id="counter" class="chrome"><span class="cur">01</span> / <span class="total">01</span></div>
  <button id="next" class="chrome" aria-label="Weiter">&#8964;</button>

<script>
// Deployed: loads /captions.json from the repo. hero = festes Startbild (leer = erstes Bild).
// order = "shuffle" | "fixed". Jedes project: image + credits. labels = Token -> Anzeige.
const FALLBACK = {
  title: "Pedro Rodrigues", role: "Retouch & Compositing",
  imageFolder: "images", hero: "", order: "shuffle",
  labels: { "pop":"POP","dock2studios":"Dock2 Studios","ddb_berlin":"DDB Berlin","vw_golf":"VW Golf","innocean":"Innocean","hyndai_kona":"Hyundai Kona" },
  photographers: [
    { name: "Frithjof Ohm", projects: [ { image: "frithjof_ohm__dock2studios__ddb_berlin__vw_golf__01.jpg", credits: ["dock2studios","ddb_berlin","vw_golf"] } ] },
    { name: "Bam", projects: [ { image: "bam__pop__innocean__hyndai_kona__01.jpg", credits: ["pop","innocean","hyndai_kona"] } ] }
  ]
};

async function loadData(){ try{ const r=await fetch("captions.json",{cache:"no-store"}); if(!r.ok) throw 0; return await r.json(); }catch{ return FALLBACK; } }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function prettify(t,l){ if(l&&Object.prototype.hasOwnProperty.call(l,t)) return l[t]; return String(t).replace(/_/g," ").replace(/\b\w/g,c=>c.toUpperCase()); }
function resolveSrc(image,folder){ const i=String(image||""); if(/^https?:\/\//i.test(i)||i.includes("/")) return i; const b=String(folder||"").replace(/\/+$/,""); return b? b+"/"+i : i; }
function toProjects(d){ const o=[]; (d.photographers||[]).forEach(g=>(g.projects||[]).forEach(p=>o.push({...p,photographer:g.name}))); return o; }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

const stage=document.getElementById("stage");
const wordmark=document.getElementById("wordmark");
const botscrim=document.getElementById("botscrim");
const slate=document.getElementById("slate");
const slatePh=document.getElementById("slate-ph");
const slateCr=document.getElementById("slate-cr");
const counter=document.getElementById("counter");
const counterCur=counter.querySelector(".cur");
const counterTotal=counter.querySelector(".total");
const nextBtn=document.getElementById("next");

function creditsHTML(p,l){ const c=Array.isArray(p.credits)?p.credits:[]; if(!c.length) return ""; return c.map((t,i)=>{ const s=esc(prettify(t,l)); return i===c.length-1?`<span class="last">${s}</span>`:s; }).join(" · "); }

let sections=[];
function idxNow(){ return Math.round(stage.scrollTop/window.innerHeight); }
function go(delta){ const n=Math.min(Math.max(idxNow()+delta,0),sections.length-1); sections[n]&&sections[n].scrollIntoView(); }

loadData().then(data=>{
  const folder=data.imageFolder||"";
  const labels=data.labels||{};
  const all=toProjects(data);
  const heroFile=data.hero||(all[0]&&all[0].image)||"";
  let gallery=all.filter(p=>p.image!==heroFile);
  if((data.order||"shuffle")==="shuffle") gallery=shuffle(gallery.slice());
  counterTotal.textContent=String(gallery.length).padStart(2,"0");

  // hero
  const hero=document.createElement("section");
  hero.id="hero"; hero.dataset.hero="1";
  hero.innerHTML=`<div class="bg"></div><div class="scrim"></div>
    <div class="intro"><h1>${esc(data.title||"Pedro Rodrigues")}</h1>
    <div class="sub">${esc(data.role||"Retouch Artist")}</div></div>
    <div id="scrollcue">scroll</div>`;
  const bg=hero.querySelector(".bg");
  if(heroFile){ const pr=new Image();
    pr.onload=()=>{ bg.style.backgroundImage=`url("${resolveSrc(heroFile,folder)}")`; };
    pr.onerror=()=>{ bg.style.background="linear-gradient(135deg,#141418,#0a0a0c)"; };
    pr.src=resolveSrc(heroFile,folder);
  } else { bg.style.background="linear-gradient(135deg,#141418,#0a0a0c)"; }
  stage.appendChild(hero);

  // gallery
  gallery.forEach((p,i)=>{
    const sec=document.createElement("section");
    sec.className="frame"; sec.dataset.i=i;
    const img=new Image();
    img.alt=[p.photographer,...(p.credits||[]).map(t=>prettify(t,labels))].filter(Boolean).join(" — ");
    img.decoding="async"; img.loading=i<2?"eager":"lazy";
    img.src=resolveSrc(p.image,folder);
    img.onerror=()=>{ const ph=document.createElement("div"); ph.className="placeholder";
      ph.innerHTML=`<div>Bild erscheint, sobald es im images-Ordner liegt</div><div class="ph-file">${esc(resolveSrc(p.image,folder))}</div>`;
      img.replaceWith(ph); if(sec.classList.contains("seen")) ph.style.opacity=1; };
    sec.appendChild(img);
    sec.addEventListener("click", ()=>go(1));   // Klick aufs Bild = weiter
    stage.appendChild(sec);
  });

  sections=[...stage.querySelectorAll("section")];

  const io=new IntersectionObserver(es=>{ es.forEach(e=>{
    if(e.intersectionRatio<0.55) return;
    const el=e.target;
    if(el.dataset.hero){ wordmark.classList.remove("show"); slate.classList.remove("show"); counter.classList.remove("show"); botscrim.classList.remove("show"); nextBtn.classList.remove("show"); return; }
    el.classList.add("seen");
    const i=+el.dataset.i, p=gallery[i];
    slatePh.textContent=p.photographer||"";
    slateCr.innerHTML=creditsHTML(p,labels);
    counterCur.textContent=String(i+1).padStart(2,"0");
    [wordmark,slate,counter,botscrim].forEach(x=>x.classList.add("show"));
    nextBtn.classList.toggle("show", i < gallery.length-1);
  }); },{threshold:[0.55]});
  sections.forEach(s=>io.observe(s));

  nextBtn.addEventListener("click", e=>{ e.stopPropagation(); go(1); });
  window.addEventListener("keydown", ev=>{
    if(ev.key==="ArrowDown"||ev.key==="PageDown"||ev.key===" "){ ev.preventDefault(); go(1); }
    else if(ev.key==="ArrowUp"||ev.key==="PageUp"){ ev.preventDefault(); go(-1); }
  });
});
</script>
</body>
</html>
