<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Pedro Rodrigues — Retouch Artist</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
  @font-face { font-family:"Phosphate";
    src:url("fonts/Phosphate.woff2") format("woff2"),url("fonts/Phosphate.woff") format("woff"),url("fonts/Phosphate.otf") format("opentype"),url("fonts/Phosphate.ttc") format("collection");
    font-weight:400 800; font-display:swap; }
  @font-face { font-family:"RockwellBold";
    src:url("fonts/Rockwell-Bold.woff2") format("woff2"),url("fonts/Rockwell-Bold.woff") format("woff"),url("fonts/Rockwell-Bold.otf") format("opentype"),url("fonts/Rockwell-Bold.ttf") format("truetype"),url("fonts/Rockwell.ttc") format("collection");
    font-weight:700; font-display:swap; }

  :root{
    --bg:#08080a; --fg:#f4f4f2; --dim:#9a9a98; --faint:#3a3a40; --line:#1a1a1e;
    --display:"Phosphate","Syne",-apple-system,BlinkMacSystemFont,sans-serif;
    --mono:"RockwellBold","IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
    --pad:clamp(16px,3vw,40px);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--fg);font-family:var(--mono);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  img{display:block}

  /* top bar */
  #topbar{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;justify-content:space-between;align-items:center;
    padding:var(--pad);pointer-events:none;mix-blend-mode:difference}
  #wordmark-sm{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.03em;text-transform:uppercase;
    color:#fff;opacity:0;transform:translateY(-6px);transition:opacity .4s,transform .4s;pointer-events:auto;text-decoration:none}
  #wordmark-sm.show{opacity:1;transform:none}
  #infoBtn{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.16em;text-transform:uppercase;
    color:#fff;background:none;border:0;cursor:pointer;pointer-events:auto;opacity:.9}
  #infoBtn:hover{opacity:1}

  /* hero */
  #hero{position:relative;height:86svh;overflow:hidden;display:flex;align-items:flex-end}
  #hero .bg{position:absolute;inset:0;background-size:cover;background-position:center;transform:scale(1.06);animation:zoom 16s ease-out forwards}
  @keyframes zoom{to{transform:scale(1)}}
  #hero .scrim{position:absolute;inset:0;background:linear-gradient(to top,rgba(8,8,10,.9),rgba(8,8,10,.1) 45%,rgba(8,8,10,.4))}
  #hero .intro{position:relative;padding:var(--pad);width:100%;opacity:0;transform:translateY(16px);animation:rise 1.1s .2s cubic-bezier(.2,.7,.2,1) forwards}
  #hero h1{font-family:var(--display);font-weight:800;text-transform:uppercase;line-height:.86;letter-spacing:-.01em;
    font-size:clamp(44px,11vw,180px);text-shadow:0 2px 50px rgba(0,0,0,.5)}
  #hero .sub{margin-top:16px;font-weight:700;font-size:clamp(12px,1.6vw,16px);letter-spacing:.22em;text-transform:uppercase;text-shadow:0 1px 16px rgba(0,0,0,.6)}
  #scrollcue{position:absolute;left:50%;bottom:calc(var(--pad) - 2px);transform:translateX(-50%);font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:#fff;text-decoration:none;opacity:.85;animation:bob 2.6s ease-in-out infinite}
  #scrollcue:hover{opacity:1}
  @keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,6px)}}
  @keyframes rise{to{opacity:1;transform:none}}

  /* grid */
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(200px,26vw,340px),1fr));gap:6px;padding:6px;background:var(--bg)}
  .cell{position:relative;aspect-ratio:4/3;overflow:hidden;cursor:pointer;background:#101014}
  .cell img{width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.02);transition:opacity .7s ease,transform .7s ease}
  .cell img.loaded{opacity:1;transform:none}
  .cell:hover img{transform:scale(1.05)}
  .cell .cap{position:absolute;left:0;right:0;bottom:0;padding:12px 13px 11px;
    background:linear-gradient(transparent,rgba(4,4,6,.82));opacity:0;transition:opacity .3s ease}
  .cell:hover .cap{opacity:1}
  .cell .cap .ph{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.01em}
  .cell .cap .cr{margin-top:2px;font-size:11px;letter-spacing:.04em;color:var(--dim)}
  @media(hover:none){.cell .cap{opacity:1;background:linear-gradient(transparent,rgba(4,4,6,.7))}}

  /* footer */
  #footer{display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:center;
    padding:clamp(30px,6vw,64px) var(--pad);font-size:12px;letter-spacing:.05em;color:var(--dim);border-top:1px solid var(--line)}
  #footer a{color:var(--dim);text-decoration:none}
  #footer a:hover{color:var(--fg)}
  #footer .legal a{margin:0 2px}

  /* lightbox */
  #lightbox{position:fixed;inset:0;z-index:60;background:rgba(5,5,7,.97);display:none;align-items:center;justify-content:center}
  #lightbox.open{display:flex}
  #lightbox img{max-width:92vw;max-height:86svh;object-fit:contain}
  .lb-meta{position:fixed;left:var(--pad);bottom:var(--pad);max-width:70vw;text-shadow:0 1px 14px rgba(0,0,0,.8)}
  .lb-meta .ph{font-family:var(--display);font-weight:700;font-size:clamp(15px,2vw,20px)}
  .lb-meta .cr{margin-top:5px;font-size:12px;letter-spacing:.06em;color:var(--dim)}
  .lb-meta .cr .last{color:var(--fg)}
  .lb-counter{position:fixed;right:var(--pad);bottom:var(--pad);font-size:12px;letter-spacing:.08em;color:var(--dim);font-variant-numeric:tabular-nums}
  .lb-counter .cur{color:var(--fg)}
  #lbClose{position:fixed;top:var(--pad);right:var(--pad);z-index:3;width:48px;height:48px;background:none;border:0;color:#fff;font-size:32px;line-height:48px;text-align:center;cursor:pointer;opacity:.9}
  #lbClose:hover{opacity:1}
  .lb-nav{position:fixed;top:64px;bottom:64px;z-index:1;width:20%;border:0;background:none;color:#fff;font-size:34px;cursor:pointer;opacity:.5;transition:opacity .25s}
  .lb-nav:hover{opacity:1}
  #lbPrev{left:0;text-align:left;padding-left:18px}
  #lbNext{right:0;text-align:right;padding-right:18px}
  @media(max-width:640px){.lb-nav{width:30%;font-size:26px;opacity:.7}.lb-meta{max-width:calc(100vw - 2*var(--pad));bottom:calc(var(--pad) + 20px)}.lb-counter{bottom:calc(var(--pad) + 20px)}}

  /* info overlay */
  #info{position:fixed;inset:0;z-index:70;background:rgba(6,6,8,.96);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);
    display:flex;align-items:center;justify-content:center;padding:clamp(28px,8vw,110px);opacity:0;visibility:hidden;transition:opacity .5s,visibility .5s}
  #info.open{opacity:1;visibility:visible}
  #info .panel{max-width:620px;width:100%}
  #info h2{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.02em;font-size:clamp(24px,4.2vw,40px);margin-bottom:26px}
  #info p{font-size:clamp(14px,1.7vw,17px);line-height:1.7;color:var(--dim);margin-bottom:15px;max-width:54ch}
  #info .agencies{margin-top:24px;font-size:13px;letter-spacing:.04em;color:var(--dim);line-height:1.6}
  #info .agencies .lbl{display:block;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);margin-bottom:7px}
  #info .contact{margin-top:26px;font-size:14px;letter-spacing:.04em;color:var(--dim)}
  #info a{color:var(--fg);text-decoration:none;border-bottom:1px solid #4a4a4f}
  #info a:hover{border-color:var(--fg)}
  #infoClose{position:fixed;top:var(--pad);right:var(--pad);background:none;border:0;color:#fff;font-size:30px;line-height:1;cursor:pointer;opacity:.85}

  @media(prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    #hero .bg{animation:none;transform:none}#hero .intro{animation:none;opacity:1;transform:none}
    .cell img{transition:none;opacity:1;transform:none}#scrollcue{animation:none}
  }
</style>
</head>
<body>
  <div id="topbar">
    <a id="wordmark-sm" href="#top">Pedro Rodrigues</a>
    <button id="infoBtn">Info</button>
  </div>

  <span id="top"></span>
  <section id="hero">
    <div class="bg"></div><div class="scrim"></div>
    <div class="intro"><h1 id="hero-name">Pedro Rodrigues</h1><div class="sub" id="hero-sub">Retouch &amp; Compositing — Hamburg</div></div>
    <a id="scrollcue" href="#grid">View work &#8595;</a>
  </section>

  <section id="grid"></section>

  <footer id="footer">
    <div class="copy">© <span id="year"></span> Pedro Rodrigues</div>
    <nav class="legal">
      <a href="/impressum">Impressum</a> ·
      <a href="/datenschutz">Datenschutz</a> ·
      <a id="footmail" href="mailto:pedro@rodrigues.de">Contact</a>
    </nav>
  </footer>

  <div id="lightbox" role="dialog" aria-modal="true">
    <button id="lbClose" aria-label="Schließen">&times;</button>
    <button id="lbPrev" class="lb-nav" aria-label="Zurück">&#8249;</button>
    <img id="lbImg" alt="" />
    <button id="lbNext" class="lb-nav" aria-label="Weiter">&#8250;</button>
    <div class="lb-meta"><div class="ph" id="lb-ph"></div><div class="cr" id="lb-cr"></div></div>
    <div class="lb-counter"><span class="cur" id="lb-cur">01</span> / <span id="lb-total">01</span></div>
  </div>

  <div id="info" role="dialog" aria-modal="true" aria-label="Info">
    <button id="infoClose" aria-label="Schließen">&times;</button>
    <div class="panel">
      <h2 id="info-name">Pedro Rodrigues</h2>
      <div id="info-about"></div>
      <div class="agencies" id="info-agencies"></div>
      <div class="contact" id="info-contact"></div>
    </div>
  </div>

<script>
// Deployed: loads /captions.json. hero, order (shuffle/fixed), photographers[].projects[] {image,credits},
// labels{token:display}, imageFolder, about[], agencies[], contact.
const FALLBACK={title:"Pedro Rodrigues",role:"Retouch & Compositing — Hamburg",imageFolder:"images",hero:"",order:"shuffle",
  about:["Retouch & compositing artist based in Hamburg.","Automotive CGI/3D · Creative Retouch · Look Development · High-End Compositing · People & Beauty · Colour","From pre-production to final master. Photo, CGI or AI-generated — made campaign-ready and on-brand."],
  agencies:["Agency One","Agency Two","Agency Three"],contact:"pedro@rodrigues.de",
  labels:{"pop":"POP","dock2studios":"Dock2 Studios","ddb_berlin":"DDB Berlin","vw_golf":"VW Golf"},
  photographers:[{name:"Frithjof Ohm",projects:[{image:"frithjof_ohm__dock2studios__ddb_berlin__vw_golf__01.jpg",credits:["dock2studios","ddb_berlin","vw_golf"]}]},
    {name:"Bam",projects:[{image:"bam__pop__aries__thisisnotla__01.jpg",credits:["pop","aries","thisisnotla"]}]}]};

async function loadData(){try{const r=await fetch("captions.json",{cache:"no-store"});if(!r.ok)throw 0;return await r.json();}catch{return FALLBACK;}}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function prettify(t,l){if(l&&Object.prototype.hasOwnProperty.call(l,t))return l[t];return String(t).replace(/_/g," ").replace(/\b\w/g,c=>c.toUpperCase());}
function resolveSrc(image,folder){const i=String(image||"");if(/^https?:\/\//i.test(i)||i.includes("/"))return i;const b=String(folder||"").replace(/\/+$/,"");return b?b+"/"+i:i;}
function toProjects(d){const o=[];(d.photographers||[]).forEach(g=>(g.projects||[]).forEach(p=>o.push({...p,photographer:g.name})));return o;}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function creditsHTML(credits,l){const c=Array.isArray(credits)?credits:[];if(!c.length)return"";return c.map((t,i)=>{const s=esc(prettify(t,l));return i===c.length-1?`<span class="last">${s}</span>`:s;}).join(" · ");}

const $=id=>document.getElementById(id);
document.getElementById("year").textContent=new Date().getFullYear();

// info overlay open/close
const info=$("info");
$("infoBtn").addEventListener("click",()=>info.classList.add("open"));
$("infoClose").addEventListener("click",()=>info.classList.remove("open"));
info.addEventListener("click",e=>{if(e.target===info)info.classList.remove("open");});

// lightbox
const lightbox=$("lightbox"),lbImg=$("lbImg"),lbPh=$("lb-ph"),lbCr=$("lb-cr"),lbCur=$("lb-cur"),lbTotal=$("lb-total");
let ITEMS=[],FOLDER="",LABELS={},cur=0;
function renderLB(){const p=ITEMS[cur];lbImg.src=resolveSrc(p.image,FOLDER);lbImg.alt=p.photographer||"";
  lbPh.textContent=p.photographer||"";lbCr.innerHTML=creditsHTML(p.credits,LABELS);lbCur.textContent=String(cur+1).padStart(2,"0");}
function openLB(i){cur=i;renderLB();lightbox.classList.add("open");}
function closeLB(){lightbox.classList.remove("open");}
function lbGo(d){cur=(cur+d+ITEMS.length)%ITEMS.length;renderLB();}
$("lbClose").addEventListener("click",closeLB);
$("lbPrev").addEventListener("click",e=>{e.stopPropagation();lbGo(-1);});
$("lbNext").addEventListener("click",e=>{e.stopPropagation();lbGo(1);});
lightbox.addEventListener("click",e=>{if(e.target===lightbox)closeLB();});
window.addEventListener("keydown",e=>{
  if(info.classList.contains("open")){if(e.key==="Escape")info.classList.remove("open");return;}
  if(!lightbox.classList.contains("open"))return;
  if(e.key==="Escape")closeLB();else if(e.key==="ArrowLeft")lbGo(-1);else if(e.key==="ArrowRight")lbGo(1);
});

loadData().then(data=>{
  FOLDER=data.imageFolder||"";LABELS=data.labels||{};
  $("hero-name").textContent=data.title||"Pedro Rodrigues";
  $("hero-sub").textContent=data.role||"Retouch & Compositing";
  $("wordmark-sm").textContent=data.title||"Pedro Rodrigues";

  // info content
  const aboutArr=Array.isArray(data.about)?data.about:(data.about?[data.about]:[]);
  $("info-name").textContent=data.title||"Pedro Rodrigues";
  $("info-about").innerHTML=aboutArr.map(p=>`<p>${esc(p)}</p>`).join("");
  const ag=Array.isArray(data.agencies)?data.agencies.filter(Boolean):[];
  $("info-agencies").innerHTML=ag.length?`<span class="lbl">Selected agencies</span>${esc(ag.join(" · "))}`:"";
  if(data.contact){$("info-contact").innerHTML=`<a href="mailto:${esc(data.contact)}">${esc(data.contact)}</a>`;$("footmail").href="mailto:"+data.contact;}

  const all=toProjects(data);
  const heroFile=data.hero||(all[0]&&all[0].image)||"";
  ITEMS=all.filter(p=>p.image!==heroFile);
  if((data.order||"shuffle")==="shuffle")ITEMS=shuffle(ITEMS.slice());
  lbTotal.textContent=String(ITEMS.length).padStart(2,"0");

  // hero bg
  const bg=document.querySelector("#hero .bg");
  if(heroFile){const pr=new Image();pr.onload=()=>bg.style.backgroundImage=`url("${resolveSrc(heroFile,FOLDER)}")`;pr.onerror=()=>bg.style.background="linear-gradient(135deg,#141418,#0a0a0c)";pr.src=resolveSrc(heroFile,FOLDER);}
  else bg.style.background="linear-gradient(135deg,#141418,#0a0a0c)";

  // grid
  const grid=$("grid");
  ITEMS.forEach((p,i)=>{
    const cell=document.createElement("div");cell.className="cell";
    const img=new Image();img.loading="lazy";img.decoding="async";img.alt=p.photographer||"";
    img.src=resolveSrc(p.image,FOLDER);
    img.addEventListener("load",()=>img.classList.add("loaded"));
    img.addEventListener("error",()=>{cell.style.background="#16161a";});
    const cap=document.createElement("div");cap.className="cap";
    cap.innerHTML=`<div class="ph">${esc(p.photographer||"")}</div><div class="cr">${creditsHTML(p.credits,LABELS)}</div>`;
    cell.appendChild(img);cell.appendChild(cap);
    cell.addEventListener("click",()=>openLB(i));
    grid.appendChild(cell);
  });

  // small wordmark appears after hero
  const io=new IntersectionObserver(es=>es.forEach(e=>{
    $("wordmark-sm").classList.toggle("show",!e.isIntersecting);
  }),{threshold:.15});
  io.observe($("hero"));
});
</script>
</body>
</html>
