<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Pedro Rodrigues — Retouch Artist</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
  /* ---- eigene Schriften aus dem fonts/-Ordner (mit Fallback auf Google-Fonts) ---- */
  @font-face {
    font-family: "Phosphate";
    src: url("fonts/Phosphate.woff2") format("woff2"),
         url("fonts/Phosphate.woff") format("woff"),
         url("fonts/Phosphate.otf") format("opentype"),
         url("fonts/Phosphate.ttc") format("collection");
    font-weight: 400 800;
    font-display: swap;
  }
  @font-face {
    font-family: "RockwellBold";
    src: url("fonts/Rockwell-Bold.woff2") format("woff2"),
         url("fonts/Rockwell-Bold.woff") format("woff"),
         url("fonts/Rockwell-Bold.otf") format("opentype"),
         url("fonts/Rockwell-Bold.ttf") format("truetype"),
         url("fonts/Rockwell.ttc") format("collection");
    font-weight: 700;
    font-display: swap;
  }

  :root {
    --bg: #08080a;
    --fg: #f4f4f2;
    --dim: #8a8a88;
    --faint: #34343a;
    --line: #1c1c20;
    --display: "Phosphate", "Syne", -apple-system, BlinkMacSystemFont, sans-serif;
    --mono: "RockwellBold", "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --pad: clamp(18px, 3.4vw, 46px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--mono);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow: hidden;
  }

  /* ---------- scroll stage ---------- */
  #stage {
    height: 100dvh;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
    scroll-behavior: smooth;
    scrollbar-width: none;
  }
  #stage::-webkit-scrollbar { display: none; }

  section {
    height: 100dvh;
    scroll-snap-align: start;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ---------- hero ---------- */
  #hero { overflow: hidden; }
  #hero .bg {
    position: absolute; inset: 0;
    background-size: cover; background-position: center;
    transform: scale(1.06);
    animation: heroZoom 14s ease-out forwards;
  }
  @keyframes heroZoom { to { transform: scale(1); } }
  #hero .scrim {
    position: absolute; inset: 0;
    background:
      linear-gradient(to top, rgba(8,8,10,.92) 0%, rgba(8,8,10,.15) 42%, rgba(8,8,10,.35) 100%);
  }
  #hero .intro {
    position: relative;
    width: 100%;
    padding: var(--pad);
    align-self: flex-end;
    opacity: 0;
    transform: translateY(14px);
    animation: rise 1.2s .25s cubic-bezier(.2,.7,.2,1) forwards;
  }
  #hero h1 {
    font-family: var(--display);
    font-weight: 800;
    letter-spacing: -.01em;
    line-height: .92;
    font-size: clamp(38px, 8.5vw, 132px);
    text-transform: uppercase;
  }
  #hero .sub {
    margin-top: 14px;
    font-size: clamp(11px, 1.4vw, 14px);
    letter-spacing: .28em;
    text-transform: uppercase;
    color: var(--fg);
  }
  #scrollcue {
    position: absolute;
    left: 50%; bottom: calc(var(--pad) - 4px);
    transform: translateX(-50%);
    font-size: 10.5px; letter-spacing: .3em; text-transform: uppercase;
    color: var(--dim);
    animation: bob 2.6s ease-in-out infinite;
  }
  @keyframes bob { 0%,100%{ transform: translate(-50%,0);} 50%{ transform: translate(-50%,6px);} }
  @keyframes rise { to { opacity: 1; transform: none; } }

  /* ---------- gallery frames ---------- */
  .frame { padding: clamp(52px, 8vh, 92px) var(--pad); }
  .frame img, .frame .placeholder {
    max-width: min(94vw, 1600px);
    max-height: 84dvh;
    width: auto; height: auto;
    object-fit: contain;
    display: block;
    opacity: 0; transform: scale(.985);
    transition: opacity 1s ease, transform 1.4s cubic-bezier(.2,.7,.2,1);
  }
  .frame.seen img, .frame.seen .placeholder { opacity: 1; transform: none; }
  .placeholder {
    width: min(90vw, 1200px); aspect-ratio: 3/2;
    border: 1px solid var(--line);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; color: var(--faint);
    font-size: 12px; letter-spacing: .04em; text-align: center; padding: 24px;
  }
  .placeholder .ph-file { color: var(--dim); word-break: break-all; }

  /* ---------- fixed chrome ---------- */
  .chrome { position: fixed; z-index: 20; pointer-events: none; user-select: none; }

  #wordmark {
    top: var(--pad); left: var(--pad);
    font-family: var(--display); font-weight: 700;
    font-size: 15px; letter-spacing: .02em; text-transform: uppercase;
    opacity: 0; transform: translateY(-6px);
    transition: opacity .5s ease, transform .5s ease;
  }
  #wordmark.show { opacity: 1; transform: none; }

  #slate {
    left: var(--pad); bottom: var(--pad);
    max-width: min(74vw, 560px);
    opacity: 0; transition: opacity .45s ease;
  }
  #slate.show { opacity: 1; }
  #slate .ph {
    font-family: var(--display); font-weight: 700;
    font-size: clamp(15px, 2vw, 20px); letter-spacing: .01em;
    color: var(--fg);
  }
  #slate .cr {
    margin-top: 6px;
    font-size: 12px; letter-spacing: .06em; line-height: 1.5;
    color: var(--dim);
  }
  #slate .cr .last { color: var(--fg); }

  #counter {
    right: var(--pad); bottom: var(--pad);
    font-size: 12px; letter-spacing: .08em; color: var(--dim);
    font-variant-numeric: tabular-nums; text-align: right;
    opacity: 0; transition: opacity .45s ease;
  }
  #counter.show { opacity: 1; }
  #counter .cur { color: var(--fg); }

  @media (max-width: 640px) {
    #slate { max-width: calc(100vw - 2*var(--pad)); bottom: calc(var(--pad) + 26px); }
    #counter { bottom: calc(var(--pad) + 26px); }
  }
  @media (prefers-reduced-motion: reduce) {
    #stage { scroll-behavior: auto; }
    #hero .bg { animation: none; transform: none; }
    #hero .intro { animation: none; opacity: 1; transform: none; }
    .frame img, .frame .placeholder { transition: none; opacity: 1; transform: none; }
    #scrollcue { animation: none; }
  }
</style>
</head>
<body>
  <header id="wordmark" class="chrome">Pedro Rodrigues</header>

  <main id="stage" aria-label="Portfolio"></main>

  <aside id="slate" class="chrome" aria-live="polite">
    <div class="ph" id="slate-ph"></div>
    <div class="cr" id="slate-cr"></div>
  </aside>
  <div id="counter" class="chrome"><span class="cur">01</span> / <span class="total">01</span></div>

<script>
// ---------------- data ----------------
// Deployed: loads /captions.json from the repo. Edit that file on GitHub to add/relabel images.
//  - "hero": filename of the fixed start image (public-safe). Empty = first image is used.
//  - "order": "shuffle" (reshuffled every visit) or "fixed" (as listed).
//  - each project: "image" (filename) + "credits" (fields from the name, shown in order).
//  - "labels": raw token -> pretty display name. "imageFolder": subfolder holding the images.
const FALLBACK = {
  title: "Pedro Rodrigues",
  role: "Retouch & Compositing",
  imageFolder: "images",
  hero: "",
  order: "shuffle",
  labels: { "pop":"POP","dock2studios":"Dock2 Studios","ddb_berlin":"DDB Berlin",
            "vw_golf":"VW Golf","innocean":"Innocean","hyndai_kona":"Hyundai Kona" },
  photographers: [
    { name: "Frithjof Ohm", projects: [
      { image: "frithjof_ohm__dock2studios__ddb_berlin__vw_golf__01.jpg", credits: ["dock2studios","ddb_berlin","vw_golf"] } ] },
    { name: "Bam", projects: [
      { image: "bam__pop__innocean__hyndai_kona__01.jpg", credits: ["pop","innocean","hyndai_kona"] } ] }
  ]
};

async function loadData() {
  try {
    const r = await fetch("captions.json", { cache: "no-store" });
    if (!r.ok) throw 0;
    return await r.json();
  } catch { return FALLBACK; }
}

function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function prettify(tok, labels){
  if (labels && Object.prototype.hasOwnProperty.call(labels, tok)) return labels[tok];
  return String(tok).replace(/_/g," ").replace(/\b\w/g,c=>c.toUpperCase());
}

function resolveSrc(image, folder){
  const img = String(image||"");
  if (/^https?:\/\//i.test(img) || img.includes("/")) return img;
  const base = String(folder||"").replace(/\/+$/,"");
  return base ? base + "/" + img : img;
}

function toProjects(data){
  const out = [];
  (data.photographers||[]).forEach(g => (g.projects||[]).forEach(p => out.push({ ...p, photographer: g.name })));
  return out;
}

function shuffle(a){
  for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

const stage    = document.getElementById("stage");
const wordmark = document.getElementById("wordmark");
const slate    = document.getElementById("slate");
const slatePh  = document.getElementById("slate-ph");
const slateCr  = document.getElementById("slate-cr");
const counter  = document.getElementById("counter");
const counterCur = counter.querySelector(".cur");
const counterTotal = counter.querySelector(".total");

function creditsHTML(p, labels){
  const c = Array.isArray(p.credits) ? p.credits : [];
  if (!c.length) return "";
  return c.map((t,i)=>{ const l = esc(prettify(t,labels));
    return i===c.length-1 ? `<span class="last">${l}</span>` : l; }).join(" · ");
}

loadData().then(data => {
  const folder = data.imageFolder || "";
  const labels = data.labels || {};
  const all = toProjects(data);

  // hero + gallery
  const heroFile = data.hero || (all[0] && all[0].image) || "";
  let gallery = all.filter(p => p.image !== heroFile);
  if ((data.order || "shuffle") === "shuffle") gallery = shuffle(gallery.slice());
  counterTotal.textContent = String(gallery.length).padStart(2,"0");

  // ---- hero section ----
  const hero = document.createElement("section");
  hero.id = "hero"; hero.dataset.hero = "1";
  hero.innerHTML =
    `<div class="bg"></div><div class="scrim"></div>
     <div class="intro">
       <h1>${esc(data.title || "Pedro Rodrigues")}</h1>
       <div class="sub">${esc(data.role || "Retouch Artist")}</div>
     </div>
     <div id="scrollcue">scroll</div>`;
  const bg = hero.querySelector(".bg");
  if (heroFile){
    const probe = new Image();
    probe.onload = () => { bg.style.backgroundImage = `url("${resolveSrc(heroFile, folder)}")`; };
    probe.onerror = () => { bg.style.background = "linear-gradient(135deg,#141418,#0a0a0c)"; };
    probe.src = resolveSrc(heroFile, folder);
  } else { bg.style.background = "linear-gradient(135deg,#141418,#0a0a0c)"; }
  stage.appendChild(hero);

  // ---- gallery sections ----
  gallery.forEach((p, i) => {
    const sec = document.createElement("section");
    sec.className = "frame"; sec.dataset.i = i;
    const img = new Image();
    img.alt = [p.photographer, ...(p.credits||[]).map(t=>prettify(t,labels))].filter(Boolean).join(" — ");
    img.decoding = "async";
    img.loading = i < 2 ? "eager" : "lazy";
    img.src = resolveSrc(p.image, folder);
    img.onerror = () => {
      const ph = document.createElement("div");
      ph.className = "placeholder";
      ph.innerHTML = `<div>Bild erscheint, sobald es im images-Ordner liegt</div>
                      <div class="ph-file">${esc(resolveSrc(p.image, folder))}</div>`;
      img.replaceWith(ph);
      if (sec.classList.contains("seen")) ph.style.opacity = 1;
    };
    sec.appendChild(img);
    stage.appendChild(sec);
  });

  const sections = [...stage.querySelectorAll("section")];

  const io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.intersectionRatio < 0.55) return;
      const el = e.target;
      if (el.dataset.hero){
        wordmark.classList.remove("show");
        slate.classList.remove("show");
        counter.classList.remove("show");
        return;
      }
      el.classList.add("seen");
      const i = +el.dataset.i;
      const p = gallery[i];
      slatePh.textContent = p.photographer || "";
      slateCr.innerHTML = creditsHTML(p, labels);
      counterCur.textContent = String(i+1).padStart(2,"0");
      wordmark.classList.add("show");
      slate.classList.add("show");
      counter.classList.add("show");
    });
  }, { threshold: [0.55] });
  sections.forEach(s => io.observe(s));

  // keyboard nav
  window.addEventListener("keydown", ev => {
    const cur = Math.round(stage.scrollTop / window.innerHeight);
    if (ev.key === "ArrowDown" || ev.key === "PageDown"){ ev.preventDefault(); sections[Math.min(cur+1, sections.length-1)]?.scrollIntoView(); }
    else if (ev.key === "ArrowUp" || ev.key === "PageUp"){ ev.preventDefault(); sections[Math.max(cur-1,0)]?.scrollIntoView(); }
  });
});
</script>
</body>
</html>
