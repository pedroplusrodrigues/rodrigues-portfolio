<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pedro Rodrigues — Files</title>

<link rel="preload" href="/fonts/Phosphate.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/Rockwell-Bold.woff2" as="font" type="font/woff2" crossorigin>

<style>
@font-face{
  font-family:Phosphate;
  src:url("/fonts/Phosphate.woff2") format("woff2"),
      url("/fonts/Phosphate.woff") format("woff"),
      url("/fonts/Phosphate.otf") format("opentype");
  font-weight:400;
  font-style:normal;
  font-display:swap;
}
@font-face{
  font-family:RockwellBold;
  src:url("/fonts/Rockwell-Bold.woff2") format("woff2"),
      url("/fonts/Rockwell-Bold.woff") format("woff"),
      url("/fonts/Rockwell-Bold.otf") format("opentype");
  font-weight:700;
  font-style:normal;
  font-display:swap;
}

:root{
  --black:#0a0a0b;
  --white:#f4f4ef;
  --red:#ff413d;
  --display:"Phosphate","Arial Black",sans-serif;
  --rock:"RockwellBold",ui-monospace,"SF Mono",Menlo,Monaco,Consolas,"Courier New",monospace;
}

*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--black);color:var(--white)}
body{font-family:var(--rock);padding:16px}
.page{min-height:calc(100vh - 32px)}

.header{padding:18px 0 58px}
.brand{
  font-family:var(--display);
  font-size:clamp(58px,6.2vw,96px);
  font-weight:400;
  font-synthesis:none;
  line-height:.82;
  letter-spacing:.005em;
  text-transform:uppercase;
}
.roleline{
  margin-top:14px;
  font-size:clamp(10px,.95vw,13px);
  line-height:1.3;
  font-weight:700;
}

.transfer{
  background:var(--red);
  color:#111;
  min-height:430px;
  padding:40px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.kicker{
  font-size:10px;
  letter-spacing:.12em;
  text-transform:uppercase;
  margin-bottom:18px;
}

.title{
  margin:0;
  font-family:var(--display);
  font-size:clamp(72px,9vw,142px);
  line-height:.78;
  font-weight:400;
  font-synthesis:none;
  letter-spacing:.005em;
  text-transform:uppercase;
}

.bottom{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:32px;
  margin-top:72px;
}

.copy{
  font-size:12px;
  line-height:1.5;
  max-width:520px;
}

.buttons{
  display:flex;
  gap:14px;
  flex-wrap:wrap;
  justify-content:flex-end;
}

.button{
  display:flex;
  align-items:center;
  justify-content:center;
  min-width:300px;
  min-height:78px;
  padding:22px 28px;
  text-decoration:none;
  font-size:13px;
  line-height:1;
  font-weight:700;
  letter-spacing:.06em;
  text-transform:uppercase;
  white-space:nowrap;
  border:3px solid #111;
}

.button:first-child{
  background:#111;
  color:var(--white);
}
.button:nth-child(2){
  background:var(--white);
  color:#111;
}
.button:first-child:hover{
  background:transparent;
  color:#111;
}
.button:nth-child(2):hover{
  background:#111;
  color:var(--white);
}

.footer{
  margin-top:17px;
  font-size:9px;
  letter-spacing:.07em;
  text-transform:uppercase;
  opacity:.58;
}

@media(max-width:760px){
  body{padding:8px}
  .header{padding:16px 8px 38px}
  .brand{font-size:52px}
  .transfer{padding:24px;min-height:520px}
  .bottom{display:block;margin-top:55px}
  .buttons{display:grid;justify-content:stretch;margin-top:28px}
  .button{width:100%;min-width:0;text-align:center}
}
</style>
</head>

<body>
<main class="page">
  <header class="header">
    <div class="brand">PEDRO<br>RODRIGUES</div>
    <div class="roleline">Freelance Retouch &amp; Compositing Artist</div>
  </header>

  <section class="transfer">
    <div>
      <div class="kicker">Private File Transfer</div>
      <h1 class="title">Download<br>Files</h1>
    </div>

    <div class="bottom">
      <div class="copy">
        Files provided by Pedro Rodrigues.<br>
        Use the buttons to start the download.
      </div>

      <div class="buttons">
        <a class="button"
           href="https://cloud.rodrigues.de/f/32d73d7e767d4d90baff/?dl=1">
          Download File 01 →
        </a>

        <a class="button"
           href="https://cloud.rodrigues.de/f/bdd0412e22d247e19e36/?dl=1">
          Download File 02 →
        </a>
      </div>
    </div>
  </section>

  <div class="footer">Pedro Rodrigues · Retouch &amp; Compositing</div>
</main>
</body>
</html>
