<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pedro Rodrigues — Files</title>
<link rel="preload" href="/fonts/Rockwell-Bold.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{
  font-family:RockwellBold;
  src:url("/fonts/Rockwell-Bold.woff2") format("woff2"),
      url("/fonts/Rockwell-Bold.woff") format("woff"),
      url("/fonts/Rockwell-Bold.otf") format("opentype"),
      url("/fonts/Rockwell-Bold.ttf") format("truetype");
  font-weight:700;
  font-style:normal;
  font-display:swap;
}

:root{
  --black:#0a0a0b;
  --white:#f4f4ef;
  --red:#ff413d;
  --rock:"RockwellBold",ui-monospace,"SF Mono",Menlo,Monaco,Consolas,"Courier New",monospace;
}

*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--black);color:var(--white)}
body{font-family:var(--rock);padding:16px}
.page{min-height:calc(100vh - 32px)}

.header{padding:20px 0 56px}
.identity{font-size:clamp(42px,5.8vw,86px);line-height:.83}
.identityMark{display:block;width:5.061em;max-width:100%;height:auto;overflow:visible}
.roleline{margin-top:12px;font-size:clamp(10px,.95vw,13px);line-height:1.3;font-weight:700}

.transfer{
  background:var(--red);
  color:#111;
  min-height:414px;
  padding:40px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.kicker{
  font-size:10px;
  letter-spacing:.12em;
  text-transform:uppercase;
  margin-bottom:18px;
}

.title{
  margin:0;
  font-family:"Arial Black","Helvetica Neue",Arial,sans-serif;
  font-size:clamp(64px,8vw,126px);
  line-height:.78;
  letter-spacing:-.055em;
  text-transform:uppercase;
  max-width:850px;
}

.bottom{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:28px;
  margin-top:70px;
}

.copy{font-size:12px;line-height:1.5;max-width:520px}

.buttons{
  display:flex;
  gap:14px;
  flex-wrap:wrap;
  justify-content:flex-end;
}

.button{
  display:flex;
  align-items:center;
  justify-content:center;
  min-width:280px;
  min-height:74px;
  padding:22px 28px;
  text-decoration:none;
  font-size:13px;
  line-height:1.05;
  font-weight:700;
  letter-spacing:.065em;
  text-transform:uppercase;
  white-space:nowrap;
  border:3px solid #111;
  transition:transform .12s ease, background .12s ease, color .12s ease;
}

.button:first-child{
  background:#111;
  color:var(--white);
}

.button:nth-child(2){
  background:var(--white);
  color:#111;
}

.button:hover{
  transform:translateY(-2px);
}

.button:first-child:hover{
  background:transparent;
  color:#111;
}

.button:nth-child(2):hover{
  background:#111;
  color:var(--white);
}

.footer{
  margin-top:17px;
  font-size:9px;
  letter-spacing:.07em;
  text-transform:uppercase;
  opacity:.58;
}

@media(max-width:760px){
  body{padding:8px}
  .header{padding:16px 8px 38px}
  .transfer{padding:24px;min-height:500px}
  .bottom{display:block;margin-top:55px}
  .buttons{display:grid;justify-content:stretch;margin-top:28px}
  .button{
    width:100%;
    min-width:0;
    min-height:72px;
    text-align:center;
  }
}
</style>
</head>
