<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pedro Rodrigues — Files</title>

<style>
@font-face{
  font-family:Phosphate;
  src:url("/fonts/Phosphate.woff2") format("woff2");
  font-weight:400;
  font-style:normal;
  font-display:swap;
}

@font-face{
  font-family:RockwellBold;
  src:url("/fonts/Rockwell-Bold.woff2") format("woff2");
  font-weight:700;
  font-style:normal;
  font-display:swap;
}

:root{
  --black:#0a0a0b;
  --white:#f4f4ef;
  --red:#ff413d;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  background:var(--black);
  color:var(--white);
}

body{
  padding:34px;
  font-family:RockwellBold,"Courier New",monospace;
}

.page{
  width:100%;
  min-height:calc(100vh - 68px);
  display:flex;
  flex-direction:column;
}

.brand{
  font-family:Phosphate,"Arial Black",sans-serif;
  font-size:clamp(48px,6vw,92px);
  font-weight:400;
  line-height:.82;
  letter-spacing:.005em;
  text-transform:uppercase;
}

.role{
  margin-top:16px;
  font-size:12px;
  line-height:1.3;
  letter-spacing:.025em;
  text-transform:uppercase;
}

.transfer{
  margin-top:70px;
  background:var(--red);
  color:#111;
  padding:44px;
  min-height:430px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.eyebrow{
  font-size:11px;
  letter-spacing:.1em;
  text-transform:uppercase;
}

h1{
  margin:16px 0 0;
  font-family:Phosphate,"Arial Black",sans-serif;
  font-size:clamp(62px,9vw,138px);
  font-weight:400;
  line-height:.8;
  letter-spacing:0;
  text-transform:uppercase;
}

.bottom{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:24px;
  margin-top:80px;
}

.copy{
  max-width:520px;
  font-size:13px;
  line-height:1.5;
}

.download{
  display:inline-block;
  background:#111;
  color:var(--white);
  border:3px solid #111;
  padding:18px 24px;
  text-decoration:none;
  font-size:12px;
  font-weight:700;
  letter-spacing:.08em;
  text-transform:uppercase;
  white-space:nowrap;
}

.download:hover{
  background:transparent;
  color:#111;
}

.downloads{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  justify-content:flex-end;
}

.footer{
  margin-top:18px;
  font-size:10px;
  letter-spacing:.07em;
  text-transform:uppercase;
  opacity:.65;
}

@media(max-width:700px){
  body{padding:18px}

  .page{
    min-height:calc(100vh - 36px);
  }

  .brand{
    font-size:52px;
  }

  .transfer{
    margin-top:45px;
    padding:25px;
    min-height:450px;
  }

  .bottom{
    display:block;
    margin-top:60px;
  }

  .download{
    margin-top:28px;
    width:100%;
    text-align:center;
  }

  .downloads{
    display:block;
  }

  .downloads .download{
    display:block;
    margin-top:12px;
  }
}
</style>
</head>

<body>

<main class="page">

  <header>
    <div class="brand">
      PEDRO<br>
      RODRIGUES
    </div>

    <div class="role">
      Freelance Retouch &amp; Compositing Artist
    </div>
  </header>

  <section class="transfer">

    <div>
      <div class="eyebrow">Private File Transfer</div>
      <h1>Download<br>Files</h1>
    </div>

    <div class="bottom">
      <div class="copy">
        Files provided by Pedro Rodrigues.<br>
        Use the button to open the private download.
      </div>

      <div class="downloads">
        <a class="download"
           href="https://cloud.rodrigues.de/f/33d38af1c3ae4044a3be/"
           target="_blank"
           rel="noopener">
          Download File 01 →
        </a>

        <a class="download"
           href="https://cloud.rodrigues.de/f/a6c738b18d1b47b38383/"
           target="_blank"
           rel="noopener">
          Download File 02 →
        </a>
      </div>
    </div>

  </section>

  <div class="footer">
    Pedro Rodrigues · Retouch &amp; Compositing
  </div>

</main>

</body>
</html>
