function r9(){stage.innerHTML=`<section id="story9" class="v v9 on"></section>`;let s=document.getElementById('story9');P.forEach((p,i)=>{let c=document.createElement('section');c.className='chapter';let t=document.createElement('div');t.className='text';t.innerHTML=`<div class="small">${String(i+1).padStart(2,'0')} / PEDRO RODRIGUES</div><h2>${p.project}</h2><p class="small">${p.photographer||'Selected Work'} · ${[...p.secondary,ct(p)].join(' · ')}</p>`;let m=med(p);bind(m,p);c.append(t,m);s.appendChild(c)})}
function r10(){stage.innerHTML=`<section class="v v10 on"><div class="btop"><div class="nbox"><div class="big">PEDRO<br>RODRIGUES</div></div><div class="side">RETOUCH<br>COMPOSITING<br>CGI<br>GENERATIVE</div></div><div id="mos" class="mosaic"></div></section>`;let m=document.getElementById('mos');P.forEach(p=>{let t=document.createElement('article');t.className='tile';t.appendChild(med(p));t.insertAdjacentHTML('beforeend',`<div class="tx"><b>${p.project}</b><span class="small">${p.photographer||'Selected Work'} · ${ct(p)}</span></div>`);bind(t,p);m.appendChild(t)})}
