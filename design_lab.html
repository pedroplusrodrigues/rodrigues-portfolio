<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pedro Rodrigues — Design Lab</title>
<style>
:root{
  --black:#08080a;--white:#f7f7f2;--line:#232329;--muted:#92929a;
  --pink:#ff3fb4;--acid:#d7ff18;--cyan:#13d9ff;--orange:#ff642e;--violet:#6d4cff;
  --blue:#265cff;--yellow:#ffd91a;--mint:#63ffc8;--cream:#f1eadb;--red:#ff3030;
}
*{box-sizing:border-box}
html,body{margin:0;background:#08080a;color:#f7f7f2;font-family:Arial,Helvetica,sans-serif}
button{font:inherit}
img{display:block}
#lab{min-height:100vh}
.lab-nav{position:sticky;top:0;z-index:500;padding:14px clamp(14px,2.5vw,34px);background:rgba(8,8,10,.93);backdrop-filter:blur(16px);border-bottom:1px solid #222229}
.lab-nav-top{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
.lab-brand{font-weight:900;letter-spacing:-.03em;font-size:clamp(22px,3vw,38px)}
.lab-brand em{font-style:normal;color:var(--acid)}
.lab-sub{font-size:11px;text-transform:uppercase;letter-spacing:.16em;color:#999}
.variant-bar{display:flex;gap:6px;overflow:auto;padding-top:12px;padding-bottom:2px}
.variant-btn{flex:0 0 auto;border:1px solid #2a2a30;background:#121216;color:#ddd;padding:9px 12px;border-radius:999px;cursor:pointer;font-size:12px}
.variant-btn.active{background:#f5f5ef;color:#09090a;border-color:#f5f5ef}
#stage{min-height:700px}
.project-media{background:#151518 center/cover no-repeat;position:relative;overflow:hidden}
.project-media.broken{background:#111114}
.project-media:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.46),transparent 60%);pointer-events:none}
.pedro-lock{font-weight:950;letter-spacing:-.055em}
.meta{font-size:11px;letter-spacing:.09em;text-transform:uppercase}
.project-card{cursor:pointer}
.project-card:focus-visible,.variant-btn:focus-visible,.close:focus-visible{outline:3px solid #fff;outline-offset:3px}

.brand-tagline{
  margin-top:12px;
  font-size:11px;
  line-height:1.4;
  letter-spacing:.12em;
  text-transform:uppercase;
  opacity:.72;
  max-width:760px
}
/* common hero */
.hero-name{font-size:clamp(76px,13vw,220px);line-height:.72;margin:0;text-transform:uppercase}
.hero-role{font-size:12px;letter-spacing:.22em;text-transform:uppercase}

/* 1 COLOR BRUTAL */
.v1{background:#f5f1e8;color:#101010;padding-bottom:80px}
.v1 .mast{background:var(--acid);border-bottom:5px solid #111;padding:clamp(24px,4vw,58px)}
.v1 .mast .hero-name{color:#111;text-shadow:7px 7px 0 var(--pink)}
.v1 .mastrow{display:flex;justify-content:space-between;gap:18px;align-items:end;flex-wrap:wrap;margin-top:34px}
.v1 .mastrow .hero-role{font-weight:900}
.v1 .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:0;border-top:5px solid #111}
.v1 .card{grid-column:span 4;border-right:5px solid #111;border-bottom:5px solid #111;background:#fff}
.v1 .card:nth-child(4n+1){background:var(--pink)}
.v1 .card:nth-child(4n+2){background:var(--cyan)}
.v1 .card:nth-child(4n+3){background:var(--orange)}
.v1 .media{aspect-ratio:4/3;border-bottom:5px solid #111}
.v1 .cardtext{padding:18px}
.v1 .cardtext b{font-size:clamp(24px,3vw,46px);line-height:.9;display:block;text-transform:uppercase}
.v1 .cardtext .photographer{font-size:12px;margin-top:10px;font-weight:900}
.v1 .cardtext .small{font-size:10px;margin-top:5px}

/* 2 ACID SWISS */
.v2{background:#e9e9e5;color:#111;padding:clamp(20px,3vw,50px)}
.v2 .head{display:grid;grid-template-columns:1.5fr .5fr;gap:20px;border-top:1px solid #111;padding-top:14px;margin-bottom:55px}
.v2 .hero-name{font-size:clamp(72px,11vw,180px);line-height:.78}
.v2 .stamp{background:#111;color:#fff;padding:18px;align-self:start;font-size:12px;text-transform:uppercase;letter-spacing:.12em}
.v2 .list{border-top:1px solid #111}
.v2 .row{display:grid;grid-template-columns:70px 1.4fr 1fr 120px;gap:20px;align-items:center;border-bottom:1px solid #111;padding:14px 0;cursor:pointer}
.v2 .row:hover{background:var(--acid)}
.v2 .thumb{aspect-ratio:4/3}
.v2 .title{font-size:clamp(24px,3vw,48px);font-weight:900;letter-spacing:-.04em}
.v2 .photo{font-size:12px;text-transform:uppercase}
.v2 .count{text-align:right;font-size:11px}

/* 3 AOL/Y2K */
.v3{background:#061667;color:#fff;font-family:"Courier New",monospace;padding-bottom:70px}
.v3 .browser{margin:0 auto;max-width:1500px;border:4px ridge #c0c0c0;background:#c0c0c0;color:#000}
.v3 .chrome{padding:8px;background:#c0c0c0;border-bottom:3px ridge #fff}
.v3 .chrome b{font-family:Arial,sans-serif}
.v3 .address{margin-top:6px;background:#fff;border:2px inset #aaa;padding:6px;font-size:12px}
.v3 .page{background:#00104f;color:#fff;padding:22px}
.v3 .y2k-title{font-family:Arial Black,Arial,sans-serif;font-size:clamp(52px,9vw,145px);line-height:.8;color:#00ffff;text-shadow:5px 5px 0 #ff00aa,10px 10px 0 #ffff00}
.v3 .blink{display:inline-block;background:#ffff00;color:#000;padding:4px 8px;margin:24px 0;font-weight:900}
.v3 .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.v3 .tile{border:3px outset #d0d0d0;background:#000080;padding:7px}
.v3 .tile .media{aspect-ratio:4/3}
.v3 .tile b{display:block;color:#00ffff;margin-top:7px;font-size:15px}
.v3 .tile span{font-size:10px;color:#ffff00}

/* 4 TERMINAL */
.v4{background:#030603;color:#9cff9c;font-family:"Courier New",monospace;padding:24px}
.v4 .term{max-width:1500px;margin:auto;border:1px solid #2b5e2b;background:#020402;box-shadow:inset 0 0 80px rgba(0,255,0,.04)}
.v4 .termbar{padding:8px 12px;border-bottom:1px solid #2b5e2b;font-size:12px}
.v4 .termhero{padding:26px}
.v4 .termhero .hero-name{font-size:clamp(55px,9vw,135px);color:#b8ffb8}
.v4 .prompt{color:#5dff5d;margin-top:14px}
.v4 .rows{border-top:1px solid #2b5e2b}
.v4 .row{display:grid;grid-template-columns:55px 1fr 220px 90px;gap:15px;padding:12px 18px;border-bottom:1px dashed #174717;cursor:pointer}
.v4 .row:hover{background:#082108}
.v4 .row b{color:#d5ffd5}
.v4 .row span{font-size:11px}

/* 5 CANDY BLOCKS */
.v5{background:#ffedf8;color:#151515;padding:18px}
.v5 .hero{background:var(--pink);border-radius:34px;padding:clamp(28px,5vw,70px);min-height:480px;display:flex;flex-direction:column;justify-content:space-between}
.v5 .hero-name{color:#fff;text-shadow:0 6px 0 #6d4cff}
.v5 .hero-bottom{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap}
.v5 .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px;margin-top:16px}
.v5 .card{grid-column:span 4;border-radius:28px;padding:12px;background:#fff;box-shadow:0 8px 0 #111}
.v5 .card:nth-child(5n+1){background:#d7ff18}
.v5 .card:nth-child(5n+2){background:#13d9ff}
.v5 .card:nth-child(5n+3){background:#ffcf43}
.v5 .media{aspect-ratio:1/1;border-radius:20px}
.v5 .card b{font-size:24px;display:block;margin:14px 8px 0}
.v5 .card span{font-size:10px;display:block;margin:6px 8px 10px;text-transform:uppercase}

/* 6 BAUHAUS */
.v6{background:#f4efe3;color:#111;padding:clamp(18px,3vw,42px)}
.v6 .top{display:grid;grid-template-columns:1fr 140px 140px;gap:14px;align-items:stretch}
.v6 .titlebox{border:4px solid #111;padding:22px}
.v6 .titlebox .hero-name{font-size:clamp(62px,9vw,140px)}
.v6 .shape1{background:#ff3030;border-radius:50%}
.v6 .shape2{background:#265cff}
.v6 .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-top:14px}
.v6 .card{grid-column:span 2;border:4px solid #111;background:#fff}
.v6 .card:nth-child(4n+1){grid-column:span 3}
.v6 .media{aspect-ratio:4/3;border-bottom:4px solid #111}
.v6 .txt{padding:14px}
.v6 .txt b{font-size:26px}
.v6 .txt span{display:block;font-size:10px;margin-top:5px;text-transform:uppercase}

/* 7 SCRAPBOOK */
.v7{background:#d6d0c4;color:#161616;padding:30px;font-family:Georgia,serif}
.v7 .paper{max-width:1500px;margin:auto;background:#f5f0e5;padding:clamp(24px,4vw,60px);box-shadow:12px 14px 0 rgba(0,0,0,.25)}
.v7 .hero-name{font-family:Arial Black,Arial,sans-serif;font-size:clamp(68px,10vw,155px);transform:rotate(-1deg)}
.v7 .scribble{font-style:italic;font-size:18px;margin:20px 0 45px}
.v7 .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:28px}
.v7 .card{grid-column:span 4;background:#fff;padding:10px 10px 20px;box-shadow:4px 5px 10px rgba(0,0,0,.18);transform:rotate(var(--r))}
.v7 .card:nth-child(odd){--r:-1.2deg}.v7 .card:nth-child(even){--r:1.1deg}
.v7 .media{aspect-ratio:4/3}
.v7 .card b{display:block;font-family:Arial,sans-serif;font-size:22px;margin-top:12px}
.v7 .card span{font-size:11px}

/* 8 CHROME CLUB */
.v8{background:radial-gradient(circle at 20% 10%,#5821ff 0,transparent 28%),radial-gradient(circle at 80% 20%,#ff2ba6 0,transparent 30%),#050508;color:#fff;padding:20px}
.v8 .hero{border:1px solid rgba(255,255,255,.25);border-radius:30px;padding:clamp(26px,5vw,70px);background:rgba(255,255,255,.06);backdrop-filter:blur(20px)}
.v8 .hero-name{background:linear-gradient(#fff,#777,#fff);-webkit-background-clip:text;color:transparent;text-shadow:0 0 30px rgba(255,255,255,.2)}
.v8 .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}
.v8 .card{border:1px solid rgba(255,255,255,.2);border-radius:22px;padding:10px;background:rgba(255,255,255,.06);backdrop-filter:blur(12px)}
.v8 .media{aspect-ratio:4/3;border-radius:16px}
.v8 .card b{font-size:22px;display:block;margin:12px 6px 4px}
.v8 .card span{font-size:10px;color:#bbb;margin:0 6px 8px;display:block;text-transform:uppercase}

/* 9 KINETIC POSTER */
.v9{background:#111;color:#fff;overflow:hidden}
.v9 .ticker{background:var(--orange);color:#111;padding:10px 0;font-weight:950;font-size:24px;white-space:nowrap;overflow:hidden}
.v9 .ticker span{display:inline-block;padding-left:20px}
.v9 .hero{padding:clamp(25px,5vw,70px);position:relative}
.v9 .hero-name{font-size:clamp(88px,16vw,260px);line-height:.68}
.v9 .hero-name .slash{color:var(--acid)}
.v9 .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:0;border-top:2px solid #fff}
.v9 .card{grid-column:span 3;border-right:2px solid #fff;border-bottom:2px solid #fff;min-height:330px;position:relative}
.v9 .media{position:absolute;inset:0}
.v9 .label{position:absolute;z-index:3;left:12px;bottom:12px;background:#fff;color:#111;padding:8px 10px;max-width:85%}
.v9 .label b{font-size:19px}.v9 .label span{display:block;font-size:9px;margin-top:3px;text-transform:uppercase}

/* 10 PLAY MODE */
.v10{background:#fff;color:#111;min-height:100vh;padding:18px}
.v10 .control{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}
.v10 .namebox{background:#111;color:#fff;padding:clamp(26px,4vw,56px);border-radius:24px}
.v10 .hero-name{font-size:clamp(70px,11vw,175px)}
.v10 .toybox{background:var(--acid);border-radius:24px;padding:28px;display:flex;flex-direction:column;justify-content:space-between}
.v10 .toybox b{font-size:34px}.v10 .toybox span{font-size:12px}
.v10 .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:10px}
.v10 .card{border:3px solid #111;border-radius:18px;overflow:hidden;background:#fff}
.v10 .card:nth-child(3n+1){transform:translateY(18px)}
.v10 .card:nth-child(4n+2){transform:rotate(1deg)}
.v10 .media{aspect-ratio:4/5}
.v10 .txt{padding:11px}
.v10 .txt b{font-size:18px;display:block}.v10 .txt span{font-size:9px;text-transform:uppercase}

/* overlay */
.overlay{position:fixed;inset:0;z-index:1000;background:rgba(5,5,7,.98);display:none;overflow:auto;color:#fff}
.overlay.open{display:block}
.overlay-top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:16px 22px;background:rgba(5,5,7,.94);backdrop-filter:blur(12px);border-bottom:1px solid #29292e}
.overlay-title b{font-size:24px}.overlay-title span{display:block;color:#999;font-size:10px;text-transform:uppercase;letter-spacing:.1em;margin-top:3px}
.close{border:1px solid #444;background:#151519;color:#fff;border-radius:999px;padding:10px 14px;cursor:pointer}
.overlay-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:3px;padding:3px}
.overlay-grid .project-media{aspect-ratio:4/3}

@media(max-width:1050px){
  .v1 .card{grid-column:span 6}.v3 .tiles{grid-template-columns:repeat(3,1fr)}.v5 .card{grid-column:span 6}
  .v8 .grid{grid-template-columns:repeat(2,1fr)}.v9 .card{grid-column:span 4}.v10 .grid{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:720px){
  .hero-name{font-size:clamp(52px,17vw,110px)!important}
  .v1 .card,.v5 .card{grid-column:span 12}
  .v2 .head{grid-template-columns:1fr}.v2 .row{grid-template-columns:44px 1fr}.v2 .thumb,.v2 .count{display:none}
  .v3 .tiles{grid-template-columns:1fr 1fr}.v4 .row{grid-template-columns:36px 1fr}.v4 .row .agent,.v4 .row .count{display:none}
  .v6 .top{grid-template-columns:1fr}.v6 .shape1,.v6 .shape2{height:90px}.v6 .card,.v6 .card:nth-child(4n+1){grid-column:span 6}
  .v7{padding:12px}.v7 .grid{display:block}.v7 .card{margin-bottom:26px}
  .v8 .grid{grid-template-columns:1fr}.v9 .card{grid-column:span 6}.v10 .control{grid-template-columns:1fr}.v10 .grid{grid-template-columns:1fr 1fr}
  .overlay-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="lab">
  <div class="lab-nav">
    <div class="lab-nav-top">
      <div>
        <div class="lab-brand">PEDRO RODRIGUES <em>/ DESIGN LAB</em></div>
        <div class="lab-sub">10 live directions · Retouch · Compositing · CGI · Generative Imaging</div>
      </div>
    </div>
    <div class="variant-bar" id="variantBar"></div>
  </div>
  <main id="stage"></main>
</div>

<div class="overlay" id="overlay">
  <div class="overlay-top">
    <div class="overlay-title"><b id="overlayProject"></b><span id="overlayMeta"></span></div>
    <button class="close" id="overlayClose">Close series</button>
  </div>
  <div class="overlay-grid" id="overlayGrid"></div>
</div>

function shuffled(items){
  const a=items.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  const ix=a.findIndex(p=>String(p.project).toLowerCase().includes("opel grandland"));
  if(ix>=0&&ix<6&&a.length>8){const [x]=a.splice(ix,1);a.splice(Math.min(a.length,9+Math.floor(Math.random()*Math.max(1,a.length-9))),0,x);}
  return a;
}

const stage=document.getElementById("stage"),bar=document.getElementById("variantBar");
const overlay=document.getElementById("overlay"),overlayGrid=document.getElementById("overlayGrid");
const overlayProject=document.getElementById("overlayProject"),overlayMeta=document.getElementById("overlayMeta");

function meta(p){return [p.photographer,...p.secondary].filter(Boolean).join(" · ")}
function count(p){return `${p.images.length} Image${p.images.length===1?"":"s"}`}
function bg(el,img){
  el.style.backgroundImage=`url("images/${img}")`;
  const t=new Image(); t.onerror=()=>{el.style.backgroundImage="none";el.classList.add("broken")}; t.src="images/"+img;
}
function media(p,cls=""){
  const d=document.createElement("div");d.className="project-media "+cls;bg(d,p.images[0]);return d;
}
function bindCard(el,p){el.tabIndex=0;el.setAttribute("role","button");el.addEventListener("click",()=>openSeries(p));el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openSeries(p)}})}
function openSeries(p){
  overlayProject.textContent=p.project;
  overlayMeta.textContent=[p.photographer,...p.secondary,count(p)].filter(Boolean).join(" · ");
  overlayGrid.innerHTML="";
  p.images.forEach(img=>{const d=document.createElement("div");d.className="project-media";bg(d,img);overlayGrid.appendChild(d)});
  overlay.classList.add("open");overlay.scrollTo(0,0);
}
document.getElementById("overlayClose").addEventListener("click",()=>overlay.classList.remove("open"));

function pedroHero(extra=""){return `<h1 class="hero-name pedro-lock">PEDRO<br>RODRIGUES${extra}</h1>`}

  const g=document.getElementById("grid");
  PROJECTS.forEach(p=>{const c=document.createElement("article");c.className="card project-card";const m=media(p,"media");const t=document.createElement("div");t.className="cardtext";t.innerHTML=`<b>${p.project}</b><div class="photographer">${p.photographer||"Selected Work"}</div><div class="small">${[...p.secondary,count(p)].join(" · ")}</div>`;c.append(m,t);bindCard(c,p);g.appendChild(c)})
}
