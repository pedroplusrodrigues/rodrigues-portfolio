<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pedro Rodrigues — Blocks 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<style>
@font-face{font-family:Phosphate;src:url("fonts/Phosphate.woff2") format("woff2"),url("fonts/Phosphate.woff") format("woff"),url("fonts/Phosphate.otf") format("opentype");font-display:swap}
:root{
 --black:#070708;--white:#f6f6f0;--acid:#dfff00;--pink:#ff38b8;--cyan:#00d8ff;--orange:#ff5a22;
 --yellow:#ffd900;--blue:#2846ff;--purple:#8b5cff;--mint:#56f0b2;--red:#ff3030;--cream:#efe9dd;
 --display:Phosphate,"Arial Black",sans-serif;--sans:Syne,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--black);color:var(--white);font-family:var(--sans);overflow-x:hidden}
button{font:inherit}
.topbar{position:sticky;top:0;z-index:300;background:rgba(7,7,8,.93);backdrop-filter:blur(18px);border-bottom:1px solid #242429;padding:12px 18px}
.toprow{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}
.wordmark{font-family:var(--display);font-size:clamp(25px,3.4vw,46px);line-height:.9;letter-spacing:.01em}
.sub{font:800 11px/1.2 var(--sans);text-transform:uppercase;letter-spacing:.08em;color:#b7b7bc;margin-top:6px}
.switcher{display:flex;gap:6px;overflow:auto;padding-top:10px}
.switch{flex:0 0 auto;border:1px solid #313138;background:#141418;color:#eee;border-radius:999px;padding:8px 11px;font-size:10px;font-weight:800;cursor:pointer}
.switch.active{background:#f4f4ee;color:#111}
#stage{min-height:700px}
.identity{font-family:var(--display);font-size:clamp(36px,5.2vw,76px);line-height:.84;letter-spacing:.01em}
.kicker{font:800 11px/1.15 var(--sans);text-transform:uppercase;letter-spacing:.08em}
.meta{font:700 9px/1.25 var(--sans);text-transform:uppercase;letter-spacing:.08em}
.media{position:relative;background:#131316 center/cover no-repeat;overflow:hidden}
.media:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.45),transparent 62%);pointer-events:none}
.card{cursor:pointer}

/* 01 CHROMA GRID */
.v1{background:var(--yellow);color:#111;padding:10px}
.v1 .head{display:grid;grid-template-columns:1.1fr .9fr;gap:10px}
.v1 .a{background:#111;color:#fff;padding:24px;min-height:220px;display:flex;flex-direction:column;justify-content:space-between}
.v1 .b{background:var(--cyan);padding:24px;display:flex;align-items:flex-end;font-size:clamp(28px,4vw,56px);font-weight:800;line-height:.9}
.v1 .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:10px;margin-top:10px}
.v1 .tile{grid-column:span 4;border:4px solid #111;background:#fff;overflow:hidden;transition:transform .25s ease}
.v1 .tile:nth-child(6n+1){grid-column:span 8;background:var(--pink)}
.v1 .tile:nth-child(6n+2){background:var(--acid)}
.v1 .tile:nth-child(6n+3){background:var(--orange)}
.v1 .tile:nth-child(6n+4){background:var(--cyan)}
.v1 .tile .media{aspect-ratio:4/3;border-bottom:4px solid #111}
.v1 .tile:hover{transform:translate(-5px,-5px);box-shadow:8px 8px 0 #111}
.v1 .tx{padding:12px}.v1 .tx b{font-size:20px;font-weight:800}.v1 .tx span{display:block;margin-top:5px}

/* 02 SLIDING BLOCKS */
.v2{background:#0a0a0b;padding:18px 0 40px;overflow:hidden}
.v2 .intro{padding:0 24px 18px}
.v2 .lane{display:flex;width:max-content;gap:12px;padding:8px 0;animation:slide 34s linear infinite}
.v2 .row:nth-child(even) .lane{animation-direction:reverse;animation-duration:42s}
.v2 .row{overflow:hidden;border-top:1px solid #2a2a2f}
.v2 .box{width:310px;flex:0 0 auto;border:1px solid #2d2d33;background:#151519}
.v2 .box .media{aspect-ratio:16/10}
.v2 .box .caption{padding:12px}.v2 .box b{font-size:18px;font-weight:800}.v2 .box span{display:block;color:#909096;margin-top:4px}

/* 03 TILT BOARD */
.v3{background:var(--cream);color:#111;padding:20px}
.v3 .board{position:relative;height:1350px;margin-top:20px;border:3px solid #111;background:linear-gradient(#d8d1c4 1px,transparent 1px),linear-gradient(90deg,#d8d1c4 1px,transparent 1px);background-size:32px 32px}
.v3 .note{position:absolute;width:255px;background:#fff;border:3px solid #111;padding:7px;box-shadow:7px 7px 0 #111;transform:rotate(var(--rot));transition:.25s}
.v3 .note:hover{transform:rotate(0) scale(1.05);z-index:10}
.v3 .note .media{aspect-ratio:4/3}
.v3 .note b{display:block;font-size:18px;font-weight:800;margin:8px 2px 2px}.v3 .note span{display:block}

/* 04 COLLISION */
.v4{background:#111;min-height:100vh;padding:20px;overflow:hidden}
.v4 .hero{position:relative;height:720px;border:1px solid #333;overflow:hidden;background:#0b0b0c}
.v4 .hero .identity{position:absolute;z-index:3;left:24px;top:24px}
.v4 .block{position:absolute;width:270px;border:3px solid #fff;background:#fff;color:#111;transition:transform .25s ease}
.v4 .block .media{aspect-ratio:4/3;border-bottom:3px solid #111}
.v4 .block .cap{padding:10px}.v4 .block b{font-size:17px;font-weight:800}.v4 .block:hover{z-index:20;transform:scale(1.06) rotate(0deg)!important}
.v4 .block:nth-child(3n+1){background:var(--pink)}.v4 .block:nth-child(3n+2){background:var(--acid)}.v4 .block:nth-child(3n){background:var(--cyan)}

/* 05 SCROLL SNAP PANELS */
.v5{background:#050506}
.v5 .snap{height:calc(100vh - 110px);overflow-y:auto;scroll-snap-type:y mandatory}
.v5 .panel{height:calc(100vh - 110px);scroll-snap-align:start;display:grid;grid-template-columns:1.1fr .9fr}
.v5 .panel .media{height:100%}
.v5 .copy{padding:30px;display:flex;flex-direction:column;justify-content:space-between}
.v5 .panel:nth-child(4n+1) .copy{background:var(--pink);color:#111}
.v5 .panel:nth-child(4n+2) .copy{background:var(--acid);color:#111}
.v5 .panel:nth-child(4n+3) .copy{background:var(--cyan);color:#111}
.v5 .panel:nth-child(4n) .copy{background:var(--orange);color:#111}
.v5 .project-title{font-size:clamp(42px,6vw,86px);font-weight:800;line-height:.9}

/* 06 MARQUEE + CUTOUT */
.v6{background:var(--blue);padding-bottom:40px}
.v6 .mast{background:#111;color:#fff;padding:22px}
.v6 .ticker{overflow:hidden;border-top:3px solid #111;border-bottom:3px solid #111;background:var(--acid);color:#111}
.v6 .ticker span{display:block;width:max-content;font-size:56px;font-weight:800;line-height:1;padding:10px 0;animation:slide 22s linear infinite}
.v6 .cutgrid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px;padding:12px}
.v6 .cut{grid-column:span 4;background:#fff;color:#111;clip-path:polygon(4% 0,100% 3%,97% 96%,0 100%);padding:8px}
.v6 .cut:nth-child(4n+1){grid-column:span 7}.v6 .cut:nth-child(4n+2){grid-column:span 5}
.v6 .cut .media{aspect-ratio:4/3}.v6 .cut b{display:block;font-size:20px;font-weight:800;padding:9px 3px 2px}.v6 .cut span{display:block;padding:0 3px 6px}

/* 07 EXPANDING TILES */
.v7{background:#f5f5ef;color:#111;padding:10px}
.v7 .header{background:#111;color:#fff;padding:22px}
.v7 .expgrid{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:270px;gap:8px;margin-top:8px}
.v7 .exp{position:relative;overflow:hidden;border:3px solid #111;background:#fff;transition:transform .35s ease}
.v7 .exp:nth-child(5n+1){grid-column:span 2;grid-row:span 2}.v7 .exp:nth-child(5n+4){grid-column:span 2}
.v7 .exp .media{position:absolute;inset:0}
.v7 .label{position:absolute;z-index:3;left:10px;right:10px;bottom:10px;background:#fff;border:2px solid #111;padding:9px}
.v7 .exp:hover{transform:scale(.98)}.v7 .exp:hover .label{background:var(--pink)}

/* 08 3D CARDS */
.v8{background:radial-gradient(circle at 50% 20%,#24242b,#08080a 55%);padding:24px;perspective:1200px}
.v8 .stack{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:24px}
.v8 .card3{background:#111;border:1px solid #3c3c44;border-radius:18px;overflow:hidden;transform:rotateX(var(--rx)) rotateY(var(--ry));transition:.3s;box-shadow:0 25px 60px rgba(0,0,0,.35)}
.v8 .card3:hover{transform:rotateX(0) rotateY(0) translateY(-8px)}
.v8 .card3 .media{aspect-ratio:4/3}.v8 .c3{padding:14px}.v8 .c3 b{font-size:19px;font-weight:800}.v8 .c3 span{display:block;color:#999;margin-top:5px}

/* 09 LIQUID BLOCKS */
.v9{background:#0a0a0b;padding:18px}
.v9 .liquidhead{display:flex;justify-content:space-between;align-items:end;gap:20px}
.v9 .liquid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px;margin-top:20px}
.v9 .blob{grid-column:span 4;background:var(--purple);padding:8px;border-radius:36px 8px 36px 8px;overflow:hidden;animation:breathe 8s ease-in-out infinite}
.v9 .blob:nth-child(4n+1){grid-column:span 7;background:var(--pink)}
.v9 .blob:nth-child(4n+2){grid-column:span 5;background:var(--cyan)}
.v9 .blob:nth-child(4n+3){background:var(--acid)}
.v9 .blob .media{aspect-ratio:4/3;border-radius:28px 4px 28px 4px}
.v9 .blob b{display:block;color:#111;font-size:20px;font-weight:800;padding:9px 5px 2px}.v9 .blob span{display:block;color:#111;padding:0 5px 6px}

/* 10 GLITCH DECK */
.v10{background:#000;padding:16px}
.v10 .deckhead{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end;border-bottom:1px solid #333;padding-bottom:14px}
.v10 .deck{display:grid;grid-template-columns:repeat(12,1fr);gap:8px;margin-top:8px}
.v10 .glitch{grid-column:span 4;position:relative;border:1px solid #444;overflow:hidden;background:#111}
.v10 .glitch:nth-child(5n+1){grid-column:span 8}.v10 .glitch:nth-child(5n+2){grid-column:span 4}.v10 .glitch .media{aspect-ratio:16/10;transition:filter .2s,transform .2s}
.v10 .glitch:hover .media{filter:contrast(1.18) saturate(1.2);transform:scale(1.025)}
.v10 .gcap{padding:12px;position:relative}
.v10 .gcap:before{content:"2026";position:absolute;right:8px;top:8px;color:var(--acid);font-size:9px;font-weight:800}
.v10 .gcap b{font-size:18px;font-weight:800}.v10 .gcap span{display:block;color:#8f8f96;margin-top:4px}

.overlay{position:fixed;inset:0;z-index:1000;background:rgba(4,4,5,.985);display:none;overflow:auto}.overlay.open{display:block}
.ovtop{position:sticky;top:0;z-index:3;background:rgba(4,4,5,.94);backdrop-filter:blur(15px);padding:14px 18px;border-bottom:1px solid #29292e;display:flex;justify-content:space-between;gap:20px}
.ovtitle b{font-size:22px;font-weight:800}.ovtitle span{display:block;color:#96969c;margin-top:4px}
.close{border:1px solid #444;background:#17171b;color:white;border-radius:999px;padding:9px 12px}
.ovgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:3px;padding:3px}.ovgrid .media{aspect-ratio:4/3}
@keyframes slide{to{transform:translateX(-50%)}}@keyframes breathe{50%{border-radius:8px 36px 8px 36px;transform:translateY(-5px)}}
@media(max-width:900px){.v1 .head,.v5 .panel{grid-template-columns:1fr}.v1 .tile,.v1 .tile:nth-child(6n+1),.v6 .cut,.v6 .cut:nth-child(4n+1),.v6 .cut:nth-child(4n+2),.v9 .blob,.v9 .blob:nth-child(4n+1),.v9 .blob:nth-child(4n+2){grid-column:span 6}.v8 .stack{grid-template-columns:repeat(2,1fr)}}
@media(max-width:650px){.identity{font-size:44px}.v1 .tile,.v1 .tile:nth-child(6n+1),.v6 .cut,.v6 .cut:nth-child(4n+1),.v6 .cut:nth-child(4n+2),.v9 .blob,.v9 .blob:nth-child(4n+1),.v9 .blob:nth-child(4n+2),.v10 .glitch,.v10 .glitch:nth-child(5n+1),.v10 .glitch:nth-child(5n+2){grid-column:span 12}.v7 .expgrid{grid-template-columns:1fr}.v7 .exp,.v7 .exp:nth-child(5n+1),.v7 .exp:nth-child(5n+4){grid-column:span 1;grid-row:span 1}.v8 .stack{grid-template-columns:1fr}.ovgrid{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}let x=a.findIndex(p=>p.project.toLowerCase().includes("opel grandland"));if(x>=0&&x<6){let q=a.splice(x,1)[0];a.splice(Math.min(a.length,9),0,q)}return a}
