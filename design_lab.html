<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pedro Rodrigues — Experimental Blocks</title>
<style>
@font-face{font-family:Phosphate;src:url("fonts/Phosphate.woff2") format("woff2"),url("fonts/Phosphate.woff") format("woff")}
@font-face{font-family:RockwellBold;src:url("fonts/Rockwell-Bold.woff2") format("woff2"),url("fonts/Rockwell-Bold.woff") format("woff")}
:root{--bg:#09090a;--fg:#f7f7f2;--pink:#ff49b7;--acid:#dfff21;--cyan:#21d9ff;--orange:#ff6b34;--yellow:#ffd92a;--cream:#f1ecdf;--lav:#b8a7ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:Arial,sans-serif}button{font:inherit}
.topbar{position:sticky;top:0;z-index:100;background:rgba(9,9,10,.94);backdrop-filter:blur(15px);border-bottom:1px solid #29292e;padding:12px 20px}
.brand{font-family:Phosphate,"Arial Black",sans-serif;font-size:clamp(28px,4vw,54px);line-height:.9}
.role{font-family:RockwellBold,Georgia,serif;font-size:11px;color:#aaa;margin-top:6px}
.switcher{display:flex;gap:6px;overflow:auto;margin-top:10px}.switch,.pause{border:1px solid #333;background:#151519;color:#eee;border-radius:999px;padding:8px 11px;font-size:11px;white-space:nowrap;cursor:pointer}.switch.active{background:#f4f4ef;color:#111}
.identity{font-family:Phosphate,"Arial Black",sans-serif;font-size:clamp(38px,5.5vw,82px);line-height:.84}
.kicker{font-family:RockwellBold,Georgia,serif;font-size:11px}.meta{font-size:10px;text-transform:uppercase;letter-spacing:.08em}
.media{background:#151518 center/cover no-repeat;position:relative;overflow:hidden}.media:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.4),transparent 62%)}.card{cursor:pointer}
.v{min-height:700px}.paused *{animation-play-state:paused!important}

/* 1 kinetic mosaic */
.v1{background:var(--yellow);color:#111;padding:12px}.hero{display:grid;grid-template-columns:1.3fr .7fr;gap:10px}.namebox{background:#111;color:#fff;padding:26px}.sidebox{background:var(--cyan);padding:24px;font-family:RockwellBold;font-size:26px}.grid12{display:grid;grid-template-columns:repeat(12,1fr);gap:10px;margin-top:10px}.tile{grid-column:span 4;border:4px solid #111;background:#fff;overflow:hidden}.tile:nth-child(5n+1){grid-column:span 8;background:var(--pink)}.tile:nth-child(5n+2){background:var(--acid)}.tile:nth-child(5n+3){background:var(--orange)}.tile .media{aspect-ratio:4/3;border-bottom:4px solid #111}.tx{padding:13px}.tx b{font-family:RockwellBold;font-size:20px}.tx span{display:block;font-size:9px;margin-top:5px;text-transform:uppercase}.tile:nth-child(odd){animation:float 6s ease-in-out infinite}

/* 2 conveyor */
.v2{padding:20px;overflow:hidden}.belt{overflow:hidden;border-top:1px solid #333;border-bottom:1px solid #333;margin-top:12px}.track{display:flex;width:max-content;gap:12px;padding:12px 0;animation:marquee 34s linear infinite}.belt:nth-child(even) .track{animation-direction:reverse;animation-duration:41s}.project{width:290px;flex:0 0 auto;background:#17171b;border:1px solid #333;border-radius:16px;overflow:hidden}.project .media{aspect-ratio:4/3}.ptext{padding:11px}.ptext b{font-family:RockwellBold;font-size:17px}.ptext span{display:block;font-size:9px;color:#aaa;margin-top:4px;text-transform:uppercase}

/* 3 magnetic */
.v3{background:var(--cream);color:#111;padding:22px}.wall{height:1200px;position:relative;margin-top:20px;border:3px solid #111;background:radial-gradient(circle at 12px 12px,#cbc5b9 2px,transparent 2px);background-size:24px 24px}.mag{position:absolute;width:255px;background:#fff;border:3px solid #111;padding:8px;box-shadow:7px 7px 0 #111;transform:rotate(var(--r));transition:.25s}.mag:hover{transform:rotate(0) scale(1.04);z-index:5}.mag .media{aspect-ratio:4/3}.mag b{display:block;font-family:RockwellBold;font-size:18px;margin-top:8px}.mag span{font-size:9px;text-transform:uppercase}

/* 4 poster stack */
.v4{padding:24px 0 70px}.poster{width:min(92vw,1160px);min-height:560px;margin:0 auto 28px;display:grid;grid-template-columns:1fr 1fr;border:4px solid #fff;box-shadow:14px 14px 0 rgba(255,255,255,.18);transform:rotate(var(--r))}.poster:nth-child(4n+1){background:var(--pink);color:#111}.poster:nth-child(4n+2){background:var(--acid);color:#111}.poster:nth-child(4n+3){background:var(--cyan);color:#111}.poster:nth-child(4n){background:var(--orange);color:#111}.poster .copy{padding:24px;display:flex;flex-direction:column;justify-content:space-between}.poster .copy b{font-family:RockwellBold;font-size:clamp(34px,5vw,68px);line-height:.9}.poster .media{min-height:560px}.poster:hover{animation:wobble .55s ease}

/* 5 live blocks */
.v5{background:#fff;color:#111;padding:12px}.livehead{display:grid;grid-template-columns:1.2fr .8fr;gap:10px}.info{background:var(--lav);padding:24px;font-family:RockwellBold;font-size:24px}.livegrid{display:grid;grid-template-columns:repeat(12,1fr);gap:10px;margin-top:10px}.live{grid-column:span 3;border:3px solid #111;position:relative;overflow:hidden}.live:nth-child(5n+1){grid-column:span 6}.live:nth-child(5n){grid-column:span 8}.live .media{aspect-ratio:4/3}.label{position:absolute;z-index:2;left:10px;right:10px;bottom:10px;background:#fff;border:2px solid #111;padding:8px;transition:.25s}.live:hover .label{transform:translateY(-6px);background:var(--acid)}.label b{font-family:RockwellBold;font-size:16px}.label span{display:block;font-size:9px;margin-top:3px;text-transform:uppercase}.live:nth-child(4n+1){animation:pulse 7s ease-in-out infinite}

/* overlay */
.overlay{position:fixed;inset:0;z-index:1000;background:rgba(5,5,7,.98);display:none;overflow:auto}.overlay.open{display:block}.ovtop{position:sticky;top:0;z-index:3;background:rgba(5,5,7,.94);padding:15px 20px;border-bottom:1px solid #333;display:flex;justify-content:space-between}.ovgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:3px;padding:3px}.ovgrid .media{aspect-ratio:4/3}.close{border:1px solid #444;background:#151519;color:#fff;border-radius:999px;padding:9px 12px}
@keyframes float{50%{transform:translateY(-8px)}}@keyframes marquee{to{transform:translateX(-50%)}}@keyframes wobble{35%{transform:rotate(.8deg) scale(1.01)}70%{transform:rotate(-.6deg) scale(1.01)}}@keyframes pulse{50%{transform:translateY(-7px)}}
@media(max-width:850px){.hero,.livehead{grid-template-columns:1fr}.tile,.tile:nth-child(5n+1),.live,.live:nth-child(5n+1),.live:nth-child(5n){grid-column:span 6}.poster{grid-template-columns:1fr}.poster .media{min-height:400px}.wall{height:1800px}}
@media(max-width:600px){.tile,.tile:nth-child(5n+1),.live,.live:nth-child(5n+1),.live:nth-child(5n){grid-column:span 12}.mag{width:205px}.ovgrid{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<div id="lab"><div class="topbar"><div class="brand">PEDRO RODRIGUES</div><div class="role">Retouch · Compositing · CGI · Generative Imaging — Traditional craft and generative workflows, working hand in hand.</div><div class="switcher" id="switcher"></div></div><main id="stage"></main></div>

<script>

gt__12.jpg", "frithjof_ohm__dock2studios__thjnk__audi_rsegt__13.jpg", "frithjof_ohm__dock2studios__thjnk__audi_rsegt__14.jpg", "frithjof_ohm__dock2studios__thjnk__audi_rsegt__15.jpg", "frithjof_ohm__dock2studios__thjnk__audi_rsegt__16.jpg", "frithjof_ohm__dock2studios__thjnk__audi_rsegt__17.jpg", "frithjof_ohm__dock2studios__thjnk__audi_rsegt__18.jpg"], "count": 18}, {"photographer": "Frithjof Ohm", "project": "VW T-Roc", "secondary": ["Dock2 Studios", "thjnk"], "images": ["frithjof_ohm__dock2studios__thjnk__vw_troc__01.jpg", "frithjof_ohm__dock2studios__thjnk__vw_troc__02.jpg", "frithjof_ohm__dock2studios__thjnk__vw_troc__03.jpg", "frithjof_ohm__dock2studios__thjnk__vw_troc__04.jpg", "frithjof_ohm__dock2studios__thjnk__vw_troc__05.jpg", "frithjof_ohm__dock2studios__thjnk__vw_troc__06.jpg", "frithjof_ohm__dock2studios__thjnk__vw_troc__07.jpg"], "count": 7}, {"photographer": "CGI", "project": "Opel Grandland", "secondary": ["Flavor3D"], "images": ["fullcgi__flavor3d__opel_grandland__01.jpg", "fullcgi__flavor3d__opel_grandland__02.jpg"], "count": 2}, {"photographer": "James Law", "project": "Beats", "secondary": ["Travis Scott"], "images": ["james_law__travis_scott__beats__01.jpg", "james_law__travis_scott__beats__02.jpg", "james_law__travis_scott__beats__03.jpg", "james_law__travis_scott__beats__04.jpg"], "count": 4}, {"photographer": "Josselin", "project": "Coca-Cola", "secondary": ["WPP", "SF"], "images": ["josselin__wpp__sf__cocacola__01.jpg", "josselin__wpp__sf__cocacola__02.jpg", "josselin__wpp__sf__cocacola__03.jpg"], "count": 3}, {"photographer": "Kurt Iswarienko", "project": "Kirsten Dunst", "secondary": ["Gloss LA"], "images": ["kurt_Iswarienko__gloss_la__kirsten_dunst__01.jpg", "kurt_Iswarienko__gloss_la__kirsten_dunst__02.jpg", "kurt_Iswarienko__gloss_la__kirsten_dunst__03.jpg"], "count": 3}, {"photographer": "Marija Mihailova", "project": "o.b.", "secondary": ["WPP", "SF"], "images": ["marija_mihailova__wpp__sf__ob__01.jpg", "marija_mihailova__wpp__sf__ob function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}let x=a.findIndex(p=>p.project.toLowerCase().includes("opel grandland"));if(x>=0&&x<6){let q=a.splice(x,1)[0];a.splice(Math.min(a.length,9),0,q)}return a}
const P=shuffle(RAW),stage=document.getElementById("stage"),sw=document.getElementById("switcher");

function bg(el,img){el.style.backgroundImage=`url("images/${img}")`}function med(p,c=""){let d=document.createElement("div");d.className="media "+c;bg(d,p.images[0]);return d}

const ov=document.getElementById("overlay"),ovg=document.getElementById("ovgrid");function openP(p){document.getElementById("opt").textContent=p.project;document.getElementById("opm").textContent=meta(p);ovg.innerHTML="";p.images.forEach(i=>{let d=document.createElement("div");d.className="media";bg(d,i);ovg.appendChild(d)});ov.classList.add("open")}document.getElementById("close").onclick=()=>ov.classList.remove("open");

function r2(){stage.innerHTML=`<section class="v v2"><div class="identity">PEDRO RODRIGUES</div><div class="kicker">Moving project belts</div><div id="belts"></div></section>`;let b=document.getElementById("belts");[P.slice(0,7),P.slice(7,14),P.slice(14)].forEach(gr=>{let belt=document.createElement("div");belt.className="belt";let tr=document.createElement("div");tr.className="track";[...gr,...gr].forEach(p=>{let c=document.createElement("div");c.className="project";c.append(med(p));c.insertAdjacentHTML("beforeend",`<div class="ptext"><b>${p.project}</b><span>${p.photographer||"Selected Work"} · ${count(p)}</span></div>`);bind(c,p);tr.append(c)});belt.append(tr);b.append(belt)})}

function r4(){stage.innerHTML=`<section class="v v4"><div style="padding:0 28px 24px"><div class="identity">PEDRO RODRIGUES</div><div class="kicker">Stacked campaign posters</div></div><div id="post"></div></section>`;let g=document.getElementById("post");P.forEach((p,i)=>{let x=document.createElement("article");x.className="poster";x.style.setProperty("--r",((i%5)-2)*.45+"deg");let c=document.createElement("div");c.className="copy";c.innerHTML=`<div class="meta">PEDRO RODRIGUES / ${String(i+1).padStart(2,"0")}</div><b>${p.project}</b><div class="meta">${p.photographer||"Selected Work"} · ${count(p)}</div>`;x.append(c,med(p));bind(x,p);g.append(x)})}

const rs=[r1,r2,r3,r4,r5],names=["01 Kinetic Mosaic","02 Conveyor Blocks","03 Magnetic Wall","04 Stacked Posters","05 Live Blocks"];
names.forEach((n,i)=>{let b=document.createElement("button");b.className="switch"+(i?"":" active");b.textContent=n;b.onclick=()=>{[...sw.children].forEach(x=>x.classList.remove("active"));b.classList.add("active");rs[i]();scrollTo({top:0,behavior:"smooth"})};sw.append(b)});r1();
