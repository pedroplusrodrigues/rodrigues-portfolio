<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pedro Rodrigues — Chroma Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
@font-face{
  font-family:Phosphate;
  src:url("fonts/Phosphate.woff2") format("woff2"),
      url("fonts/Phosphate.woff") format("woff"),
      url("fonts/Phosphate.otf") format("opentype"),
      url("fonts/Phosphate.ttc") format("collection");
  font-weight:400 800;
  font-display:swap;
}
@font-face{
  font-family:RockwellBold;
  src:url("fonts/Rockwell-Bold.woff2") format("woff2"),
      url("fonts/Rockwell-Bold.woff") format("woff"),
      url("fonts/Rockwell-Bold.otf") format("opentype"),
      url("fonts/Rockwell-Bold.ttf") format("truetype"),
      url("fonts/Rockwell.ttc") format("collection");
  font-weight:700;
  font-display:swap;
}
:root{
  --black:#0a0a0b;--white:#f4f4ef;
  --yellow:#ffd800;--cyan:#00c8f2;--pink:#ff4db8;--acid:#d8ff17;--orange:#ff6a31;
  --blue:#3157ff;--purple:#9969ff;--mint:#67f0bd;--cream:#efe8db;--red:#ff413d;
  --display:"Phosphate","Arial Black",sans-serif;
  --rock:"RockwellBold","IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--black);color:var(--white);font-family:var(--rock);overflow-x:hidden}
button{font-family:var(--rock)}
.labnav{
  position:sticky;top:0;z-index:400;
  background:#09090a;border-bottom:1px solid #2c2c31;
  padding:9px 18px 10px;
}
.switcher{display:flex;gap:6px;overflow:auto}
.switch{
  flex:0 0 auto;border:1px solid #35353c;background:#151519;color:#eee;
  border-radius:999px;padding:7px 11px;font-size:10px;font-weight:700;cursor:pointer
}
.switch.active{background:#f5f5ef;color:#111}
#stage{min-height:760px}
.identity{
  font-family:var(--display);
  font-size:clamp(42px,5.8vw,86px);
  line-height:.83;
  letter-spacing:.005em;
  text-transform:uppercase
}
.subline,.meta,.project-title,.label,.tag,.bigword{font-family:var(--rock)}
.subline{font-size:11px;line-height:1.2;letter-spacing:.05em;text-transform:uppercase}
.meta{font-size:9px;line-height:1.25;letter-spacing:.06em;text-transform:uppercase}
.media{position:relative;background:#141416 center/cover no-repeat;overflow:hidden}
.media:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.38),transparent 62%);pointer-events:none}
.card{cursor:pointer}

/* 01 CLASSIC CHROMA / cleaned */
.v1{background:var(--yellow);color:#111;padding:10px}
.v1 .hero{background:#111;color:#fff;padding:26px;min-height:220px;display:flex;flex-direction:column;justify-content:space-between}
.v1 .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:10px;margin-top:10px}
.v1 .tile{grid-column:span 4;border:4px solid #111;background:#fff;overflow:hidden}
.v1 .tile:nth-child(6n+1){grid-column:span 8;background:var(--pink)}
.v1 .tile:nth-child(6n+2){background:var(--acid)}
.v1 .tile:nth-child(6n+3){background:var(--orange)}
.v1 .tile:nth-child(6n+4){background:var(--cyan)}
.v1 .tile .media{aspect-ratio:4/3;border-bottom:4px solid #111}
.v1 .tx{padding:13px}.v1 .tx b{font-size:20px}.v1 .tx span{display:block;margin-top:5px}

/* 02 OFFSET GRID */
.v2{background:#f4f0e7;color:#111;padding:12px}
.v2 .hero{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.v2 .left{background:var(--pink);padding:28px;min-height:240px}
.v2 .right{background:#111;color:white;padding:24px;display:flex;align-items:end}
.v2 .grid{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:210px;gap:10px;margin-top:10px}
.v2 .cell{border:4px solid #111;position:relative;overflow:hidden}
.v2 .cell:nth-child(7n+1){grid-column:span 3;grid-row:span 2}
.v2 .cell:nth-child(7n+2){grid-column:span 2}
.v2 .cell:nth-child(7n+3){grid-column:span 1}
.v2 .cell:nth-child(7n+4){grid-column:span 2}
.v2 .cell:nth-child(7n+5){grid-column:span 2}
.v2 .cell:nth-child(7n+6){grid-column:span 1}
.v2 .cell:nth-child(7n){grid-column:span 3}
.v2 .cell .media{position:absolute;inset:0}
.v2 .cap{position:absolute;z-index:3;left:8px;right:8px;bottom:8px;background:#fff;color:#111;padding:8px;border:2px solid #111}

/* 03 COLOR BANDS */
.v3{background:#0c0c0d}
.v3 .hero{padding:26px}
.v3 .band{display:grid;grid-template-columns:260px 1fr;min-height:250px;border-top:3px solid #111}
.v3 .band:nth-child(5n+1){background:var(--acid);color:#111}
.v3 .band:nth-child(5n+2){background:var(--pink);color:#111}
.v3 .band:nth-child(5n+3){background:var(--cyan);color:#111}
.v3 .band:nth-child(5n+4){background:var(--orange);color:#111}
.v3 .band:nth-child(5n){background:var(--purple);color:#111}
.v3 .bandtext{padding:20px;display:flex;flex-direction:column;justify-content:space-between}
.v3 .bandtext b{font-size:23px}
.v3 .band .media{min-height:250px}

/* 04 HUGE IMAGE / TINY BLOCKS */
.v4{background:var(--blue);padding:10px}
.v4 .hero{background:#111;padding:24px;margin-bottom:10px}
.v4 .feature{display:grid;grid-template-columns:2.2fr .8fr;gap:10px}
.v4 .feature .bigimg{min-height:650px;border:4px solid #111}
.v4 .rail{display:grid;grid-template-columns:1fr;gap:10px}
.v4 .small{border:4px solid #111;background:#fff;color:#111;display:grid;grid-template-columns:110px 1fr;min-height:120px}
.v4 .small .media{height:100%}
.v4 .smalltxt{padding:10px}.v4 .smalltxt b{font-size:16px}

/* 05 POSTER GRID */
.v5{background:var(--cream);color:#111;padding:12px}
.v5 .hero{display:flex;justify-content:space-between;gap:20px;align-items:end;padding:18px 8px 26px}
.v5 .posters{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.v5 .poster{border:4px solid #111;padding:8px;background:#fff;min-height:520px;display:flex;flex-direction:column}
.v5 .poster:nth-child(4n+1){background:var(--pink)}
.v5 .poster:nth-child(4n+2){background:var(--acid)}
.v5 .poster:nth-child(4n+3){background:var(--cyan)}
.v5 .poster:nth-child(4n){background:var(--orange)}
.v5 .poster .media{aspect-ratio:4/3;border:3px solid #111}
.v5 .poster h3{font-size:34px;line-height:.9;margin:18px 6px 10px}
.v5 .poster .meta{margin:0 6px 8px}

/* 06 SIDE INDEX */
.v6{background:#0a0a0b;display:grid;grid-template-columns:360px 1fr;min-height:900px}
.v6 .index{background:var(--acid);color:#111;padding:20px;position:sticky;top:48px;height:calc(100vh - 48px);overflow:auto}
.v6 .index .identity{font-size:52px}
.v6 .ix{padding:11px 0;border-top:1px solid #111;font-size:14px;cursor:pointer}
.v6 .display{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:8px}
.v6 .display .card{border:1px solid #28282e}
.v6 .display .media{aspect-ratio:16/10}
.v6 .display .label{padding:12px;background:#121216}

/* 07 COLOR WINDOWS */
.v7{background:#1a1a1c;padding:16px}
.v7 .hero{padding:8px 8px 24px}
.v7 .windows{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}
.v7 .win{grid-column:span 4;border:3px solid #111;background:#fff;color:#111;box-shadow:10px 10px 0 #000}
.v7 .win:nth-child(6n+1){grid-column:span 7;background:var(--pink)}
.v7 .win:nth-child(6n+2){grid-column:span 5;background:var(--cyan)}
.v7 .win:nth-child(6n+3){grid-column:span 4;background:var(--acid)}
.v7 .win:nth-child(6n+4){grid-column:span 8;background:var(--orange)}
.v7 .bar{height:24px;border-bottom:3px solid #111;display:flex;gap:5px;align-items:center;padding:0 7px}
.v7 .dot{width:8px;height:8px;border-radius:50%;background:#111}
.v7 .win .media{aspect-ratio:16/10}
.v7 .wcap{padding:10px}.v7 .wcap b{font-size:18px}

/* 08 EDITORIAL BLOCKS */
.v8{background:#fff;color:#111;padding:16px}
.v8 .hero{display:grid;grid-template-columns:1.4fr .6fr;border-bottom:3px solid #111;padding-bottom:18px}
.v8 .heroaside{display:flex;align-items:end;font-size:18px}
.v8 .editorial{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;margin-top:14px}
.v8 article:nth-child(5n+1){grid-column:1/9}
.v8 article:nth-child(5n+2){grid-column:9/13;margin-top:100px}
.v8 article:nth-child(5n+3){grid-column:2/6;margin-top:30px}
.v8 article:nth-child(5n+4){grid-column:6/13}
.v8 article:nth-child(5n){grid-column:1/7;margin-top:70px}
.v8 article .media{aspect-ratio:4/3}
.v8 article:nth-child(5n+2) .media,.v8 article:nth-child(5n+3) .media{aspect-ratio:4/5}
.v8 .ecap{border-top:2px solid #111;padding-top:7px;margin-top:7px}

/* 09 MICRO TO MACRO */
.v9{background:var(--yellow);color:#111;padding:10px}
.v9 .hero{background:#111;color:#fff;padding:24px}
.v9 .micro{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin-top:10px}
.v9 .thumb{border:3px solid #111;background:#fff}
.v9 .thumb .media{aspect-ratio:1}
.v9 .thumb .meta{padding:7px}
.v9 .macro{margin-top:10px;border:4px solid #111;display:grid;grid-template-columns:1.5fr .5fr;background:var(--cyan)}
.v9 .macro .media{min-height:620px}
.v9 .macrotext{padding:22px;display:flex;flex-direction:column;justify-content:end}
.v9 .macrotext b{font-size:46px;line-height:.9}

/* 10 HARD CUT */
.v10{background:#000;padding:10px}
.v10 .hero{background:var(--red);color:#111;padding:24px;min-height:210px}
.v10 .hard{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;margin-top:10px}
.v10 .hard .card{grid-column:span 3;min-height:260px;position:relative}
.v10 .hard .card:nth-child(7n+1){grid-column:span 6;min-height:520px}
.v10 .hard .card:nth-child(7n+2){grid-column:span 3}
.v10 .hard .card:nth-child(7n+3){grid-column:span 3}
.v10 .hard .card:nth-child(7n+4){grid-column:span 4}
.v10 .hard .card:nth-child(7n+5){grid-column:span 8}
.v10 .hard .media{position:absolute;inset:0}
.v10 .hardcap{position:absolute;z-index:3;left:10px;bottom:10px;right:10px;color:#fff;text-shadow:0 2px 8px #000}
.v10 .hardcap b{font-size:18px}

/* overlay */
.overlay{position:fixed;inset:0;z-index:1000;background:rgba(4,4,5,.985);display:none;overflow:auto}
.overlay.open{display:block}
.ovtop{position:sticky;top:0;z-index:3;background:rgba(4,4,5,.95);padding:14px 18px;border-bottom:1px solid #29292e;display:flex;justify-content:space-between;gap:20px}
.ovtitle b{font-size:22px}.ovtitle span{display:block;color:#96969c;margin-top:4px}
.close{border:1px solid #444;background:#17171b;color:white;border-radius:999px;padding:9px 12px}
.ovgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:3px;padding:3px}.ovgrid .media{aspect-ratio:4/3}

@media(max-width:950px){
 .v2 .hero,.v4 .feature,.v8 .hero,.v9 .macro{grid-template-columns:1fr}
 .v5 .posters{grid-template-columns:repeat(2,1fr)}
 .v6{grid-template-columns:1fr}.v6 .index{position:relative;top:0;height:auto}.v6 .display{grid-template-columns:1fr}
 .v7 .win,.v7 .win:nth-child(6n+1),.v7 .win:nth-child(6n+2),.v7 .win:nth-child(6n+3),.v7 .win:nth-child(6n+4){grid-column:span 6}
 .v9 .micro{grid-template-columns:repeat(4,1fr)}
}
@media(max-width:650px){
 .identity{font-size:46px}
 .v1 .tile,.v1 .tile:nth-child(6n+1){grid-column:span 12}
 .v2 .grid{grid-template-columns:1fr}.v2 .cell,.v2 .cell:nth-child(n){grid-column:span 1;grid-row:span 1}
 .v3 .band{grid-template-columns:1fr}.v3 .band .media{min-height:360px}
 .v5 .posters{grid-template-columns:1fr}
 .v7 .win,.v7 .win:nth-child(n){grid-column:span 12}
 .v8 .editorial{display:block}.v8 article{margin:0 0 30px!important}
 .v9 .micro{grid-template-columns:repeat(2,1fr)}
 .v10 .hard .card,.v10 .hard .card:nth-child(n){grid-column:span 12;min-height:360px}
 .ovgrid{grid-template-columns:1fr}
}
</style>
</head>

</div>

function shuffle(a){
  a=a.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  let x=a.findIndex(p=>p.project.toLowerCase().includes("opel grandland"));
  if(x>=0&&x<6){let q=a.splice(x,1)[0];a.splice(Math.min(a.length,9),0,q)}
  return a
}
const P=shuffle(RAW),stage=document.getElementById("stage"),sw=document.getElementById("switcher");
function count(p){return p.images.length+" Image"+(p.images.length===1?"":"s")}
function meta(p){return [p.photographer,...p.secondary,count(p)].filter(Boolean).join(" · ")}
function bg(el,img){el.style.backgroundImage=`url("images/${img}")`}
function med(p,c=""){let d=document.createElement("div");d.className="media "+c;bg(d,p.images[0]);return d}
function bind(el,p){el.classList.add("card");el.tabIndex=0;el.onclick=()=>openP(p);el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openP(p)}}}
const ov=document.getElementById("overlay"),ovg=document.getElementById("ovgrid");
function openP(p){
  document.getElementById("opt").textContent=p.project;
  document.getElementById("opm").textContent=meta(p);
  ovg.innerHTML="";
  p.images.forEach(i=>{let d=document.createElement("div");d.className="media";bg(d,i);ovg.append(d)});
  ov.classList.add("open")
}
document.getElementById("close").onclick=()=>ov.classList.remove("open");
